<style>
  .modal-overlay-custom {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.5);
    z-index: 100000;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: opacity 0.3s ease-in-out;
  }
  .modal-overlay-custom.show {
    opacity: 1;
  }
  .modal-content-custom {
    background-color: #ffffff;
    width: 90%;
    max-width: 400px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: sans-serif;
    transform: translateY(-20px);
    transition: transform 0.3s ease-in-out;
  }
  .modal-overlay-custom.show .modal-content-custom {
    transform: translateY(0);
  }
  .modal-header-custom {
    padding: 16px 20px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-title-custom {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    color: #374151;
  }
  .modal-close-custom {
    font-size: 24px;
    font-weight: bold;
    color: #9ca3af;
    cursor: pointer;
    line-height: 1;
    transition: color 0.2s;
  }
  .modal-close-custom:hover {
    color: #1f2937;
  }
  .modal-body-custom {
    padding: 20px;
  }
  .modal-label-custom {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: #374151;
    margin-bottom: 8px;
  }
  .modal-input-custom {
    display: block;
    width: 100%;
    padding: 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
    background-color: #ffffff;
    color: #374151;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .modal-input-custom:focus {
    border-color: #86b7fe;
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    outline: none;
  }
  .modal-preview-custom {
    display: none;
    align-items: center;
    justify-content: center;
    margin-top: 16px;
    padding: 16px;
    border: 1px dashed #d1d5db;
    border-radius: 6px;
    background-color: #f9fafb;
    min-height: 100px;
  }
  .modal-preview-img-custom {
    max-width: 100%;
    max-height: 120px;
    object-fit: contain;
    border-radius: 4px;
  }
  .modal-footer-custom {
    padding: 16px 20px;
    border-top: 1px solid #e5e7eb;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .btn-cancel-custom {
    padding: 8px 16px;
    border: 1px solid #d1d5db;
    background-color: #ffffff;
    color: #374151;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  .btn-cancel-custom:hover {
    background-color: #f3f4f6;
  }
  .btn-save-custom {
    padding: 8px 16px;
    border: none;
    background-color: var(--primary);
    color: #ffffff;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.2s, opacity 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-save-custom:hover:not(:disabled) {
    background-color: var(--primary);
  }
  .btn-save-custom:disabled {
    cursor: not-allowed;
    opacity: 0.65;
  }
</style>

<div id="logo-modal" class="modal-overlay-custom">
  <div class="modal-content-custom">
    <div class="modal-header-custom">
      <h3 class="modal-title-custom">Ganti Logo Aplikasi</h3>
      <span class="modal-close-custom" onclick="closeLogoModal()">&times;</span>
    </div>
    <div class="modal-body-custom">
      <div>
        <label class="modal-label-custom">Pilih File Logo</label>
        <input type="file" id="logo-upload-input-modal" class="modal-input-custom" accept="image/png, image/jpeg, image/jpg, image/webp" onchange="previewSelectedLogo(this)">
      </div>
      <div id="logo-preview-container" class="modal-preview-custom">
        <img id="logo-preview-img" class="modal-preview-img-custom" src="" alt="Pratinjau Logo">
      </div>
    </div>
    <div class="modal-footer-custom">
      <button class="btn-cancel-custom" onclick="closeLogoModal()">Batal</button>
      <button id="btn-save-logo" class="btn-save-custom" onclick="processAndUploadLogo()" disabled>
        <i class="fas fa-save"></i> Simpan
      </button>
    </div>
  </div>
</div>

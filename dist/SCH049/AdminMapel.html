<div class="dashboard-layout">

  <div class="sidebar-container-slot"></div>

  <div class="main-content">
    <div class="page-header">
      <div class="page-header-left">
        <button class="btn btn-outline btn-hamburger hidden-desktop" onclick="toggleSidebar()"
          aria-label="Buka navigasi sidebar"><i class="fas fa-bars"></i></button>
        <div class="page-header-info">
          <nav class="breadcrumb">Admin <span><i class="fas fa-chevron-right"></i></span> Mapel</nav>
          <h2>Manajemen Daftar Mapel</h2>
        </div>
      </div>
      <div class="page-header-actions">
        <button class="btn btn-primary" onclick="openMapelModal()"><i class="fas fa-plus"></i> Tambah Mapel</button>
      </div>
    </div>

    <div class="table-container" style="overflow-x: auto;">
      <table id="tbl-mapel">
        <thead>
          <tr>
            <th width="10%">No</th>
            <th width="30%">Kode/ID Mapel</th>
            <th width="40%">Nama Mapel</th>
            <th width="20%">Aksi</th>
          </tr>
        </thead>
        <tbody>

        </tbody>
      </table>
    </div>
  </div>
</div>


<div id="modal-mapel" class="hidden"
  style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); z-index:1000; display:flex; justify-content:center; align-items:center;">
  <div class="glass-panel" style="background:white; width:90%; max-width:500px; padding:2rem;">
    <h3 class="mb-4" id="modal-mapel-title">Tambah Mapel</h3>

    <form id="frm-mapel" onsubmit="event.preventDefault(); saveMapelAction();">
      <div class="form-group mb-4">
        <label>Kode / ID Mapel (Unik - Otomatis)</label>
        <input type="text" id="mapel-id" class="form-control" required readonly
          style="background-color: #f3f4f6; color: #6b7280; cursor: not-allowed;" placeholder="Dihasilkan Otomatis">
      </div>
      <div class="form-group mb-4">
        <label>Nama Mapel</label>
        <input type="text" id="mapel-nama" class="form-control" placeholder="Contoh: Matematika Peminatan" required>
      </div>

      <div class="flex justify-between mt-4 border-t pt-4">
        <button type="button" class="btn btn-outline" onclick="closeMapelModal()">Batal</button>
        <button type="submit" class="btn btn-primary" id="btn-save-mapel">Simpan Mapel</button>
      </div>
    </form>
  </div>
</div>

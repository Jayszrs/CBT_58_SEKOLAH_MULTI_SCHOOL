<script>
function initAdminLogin() {
  document.querySelector('[data-school-name]').textContent = APP_GLOBAL_CONFIG.schoolName;
  const centralLink = document.getElementById('central-admin-link');
  try {
    const centralUrl = new URL(APP_GLOBAL_CONFIG.centralAdminUrl || '');
    if (centralLink && centralUrl.protocol === 'https:' && !centralUrl.username && !centralUrl.password) {
      centralLink.href = centralUrl.href;
      centralLink.style.display = 'inline-block';
    }
  } catch (error) { /* Keep the link hidden when no valid panel URL is configured. */ }
  document.getElementById('btn-google-owner').style.display = APP_GLOBAL_CONFIG.ownerGoogleLoginAvailable ? 'block' : 'none';
  AppStore.user = null;
  localStorage.removeItem('CBT_SESSION');
  
  
  document.getElementById('admin-rate-limit-alert').style.display = 'none';
  document.getElementById('admin-login-inputs').style.display = 'block';

  
  const logoEl = document.getElementById('admin-login-logo');
  const iconEl = document.getElementById('admin-login-icon');
  if (typeof APP_GLOBAL_CONFIG !== 'undefined' && APP_GLOBAL_CONFIG.logo_url && logoEl && iconEl) {
     logoEl.src = APP_GLOBAL_CONFIG.logo_url;
     logoEl.onerror = function() {
         logoEl.style.display = 'none';
         iconEl.style.display = '';
     };
     logoEl.style.display = '';
     iconEl.style.display = 'none';
  }
  
  
  api.call('checkAdminLoginStatus').then(res => {
    if (!res.success && res.status === 'rate_limited') {
      document.getElementById('admin-rate-limit-alert').style.display = 'block';
      let min = Math.ceil(res.remaining / 60);
      document.getElementById('admin-rate-limit-msg').innerText = `Terlalu banyak percobaan gagal. Form diblokir sementara. Coba lagi dalam ${min} menit.`;
      // Keep the form and central-panel link available during school cooldown.
      document.getElementById('admin-login-inputs').style.display = 'block';
    }
  }).catch(e => console.error(e));
}

function doGoogleOwnerLogin() {
  const button = document.getElementById('btn-google-owner');
  button.disabled = true;
  api.call('loginGoogleSchoolOwner').then(function (result) {
    if (!result.success) throw new Error(result.message);
    AppStore.user = { role: 'admin', data: { token: result.sessionToken } };
    localStorage.setItem('CBT_SESSION', JSON.stringify(AppStore.user));
    navigateTo('admin-dashboard');
  }).catch(function (error) { showToast(error.message || 'Gagal masuk. Coba lagi.', 'error'); })
    .finally(function () { button.disabled = false; });
}

function doAdminLogin() {
  const pw = document.getElementById('admin-password').value;
  const username = (document.getElementById('admin-username') && document.getElementById('admin-username').value || '').trim();
  if (!pw) return;
  
  
  const btn = document.getElementById('btn-admin-login');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
  
  api.call('loginAdmin', pw, username).then(res => {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-lock-open"></i> Login Dashboard';
    
    if (res.success) {
      
      AppStore.user = { role: 'admin', data: { token: res.sessionToken } };
      localStorage.setItem('CBT_SESSION', JSON.stringify(AppStore.user));
      if (res.passwordReset) showToast('Password administrator berhasil direset ke password awal. Segera ubah melalui menu Ganti Password.', 'success');
      navigateTo('admin-dashboard');
    } else {
      showToast(res.message, 'error');
      if (res.rateLimited) {
        initAdminLogin(); 
      }
    }
  }).catch(e => {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-lock-open"></i> Login Dashboard';
  });
}
</script>

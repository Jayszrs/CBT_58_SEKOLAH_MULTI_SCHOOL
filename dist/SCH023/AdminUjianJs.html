<script>
function initAdminUjian() {
  if (!AppStore.user || AppStore.user.role !== 'admin') {
    navigateTo('admin-login');
    return;
  }
  
  Promise.all([
    api.call('executeAdminAction', AppStore.user.data.token, 'getKelas', {}),
    api.call('executeAdminAction', AppStore.user.data.token, 'getConfig', {}),
    api.call('executeAdminAction', AppStore.user.data.token, 'getMapel', {}),
    api.call('executeAdminAction', AppStore.user.data.token, 'getAllPaketSoal', { bypassCache: true })
  ]).then(([kelasRes, configRes, mapelRes, paketRes]) => {
    daftarSemuaKelas = kelasRes || [];
    daftarSemuaMapel = mapelRes || [];
    const daftarPaket = paketRes || [];
    
    if (configRes) {
      const toggleAktif = document.getElementById('conf-aktif-toggle');
      if (toggleAktif) {
        toggleAktif.checked = configRes.aktif === true;
        toggleStatusText();
      }

      const toggleAcak = document.getElementById('conf-acak-toggle');
      if (toggleAcak) {
        toggleAcak.checked = configRes.acak_soal === true;
        
        
        if (typeof toggleAcakText === 'function') {
           toggleAcakText();
        }
      }
      
      document.getElementById('conf-durasi').value = configRes.durasi || 60;
      document.getElementById('conf-token').value = configRes.token || '';
      
      const allowedStr = configRes.kelas_diizinkan || '';
      currentAllowedKelasArray = allowedStr.split(',').map(c => c.trim()).filter(c => c.length > 0);
      document.getElementById('conf-kelas-diizinkan').value = allowedStr;

      
      const formatToDateTimeLocal = (dateString) => {
        if (!dateString) return '';
        const d = new Date(dateString);
        if (isNaN(d.getTime())) return '';
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const mn = String(d.getMinutes()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}T${hh}:${mn}`;
      };

      if (configRes.waktu_mulai) {
        document.getElementById('conf-waktu-mulai').value = formatToDateTimeLocal(configRes.waktu_mulai);
      } else {
        document.getElementById('conf-waktu-mulai').value = '';
      }
      
      if (configRes.waktu_selesai) {
        document.getElementById('conf-waktu-selesai').value = formatToDateTimeLocal(configRes.waktu_selesai);
      } else {
        document.getElementById('conf-waktu-selesai').value = '';
      }
      
      document.getElementById('conf-nama-ujian').value = configRes.nama_ujian || '';
      
      const mapelSelect = document.getElementById('conf-mapel-ujian');
      mapelSelect.innerHTML = '<option value="">-- Semua Mata Pelajaran --</option>';
      daftarSemuaMapel.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.nama;
          opt.innerText = m.nama;
          mapelSelect.appendChild(opt);
      });
      
      const paketSelect = document.getElementById('conf-paket-ujian');
      paketSelect.innerHTML = '<option value="">-- Pilih Paket Soal --</option>';
      daftarPaket.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id_paket;
          opt.innerText = p.nama_paket + ' (' + (p.soal_ids || []).length + ' soal)';
          paketSelect.appendChild(opt);
      });

      if (configRes.paket_ujian && configRes.paket_ujian !== '') {
          paketSelect.value = configRes.paket_ujian;
          document.getElementById('mode-paket').checked = true;
      } else {
          if (configRes.mapel_ujian) mapelSelect.value = configRes.mapel_ujian;
          document.getElementById('mode-mapel').checked = true;
      }
      toggleSourceMode();
      
      renderCheckboxKelas();
    }
  }).catch(() => showToast('Gagal memuat pengaturan atau data kelas', 'error'));
}

let daftarSemuaKelas = [];
let daftarSemuaMapel = [];
let currentAllowedKelasArray = [];

function toggleSourceMode() {
  const isPaket = document.getElementById('mode-paket').checked;
  const groupMapel = document.getElementById('group-mapel');
  const groupPaket = document.getElementById('group-paket');
  
  if (isPaket) {
    groupMapel.classList.add('hidden');
    groupPaket.classList.remove('hidden');
  } else {
    groupMapel.classList.remove('hidden');
    groupPaket.classList.add('hidden');
  }
}

function renderCheckboxKelas() {
  const container = document.getElementById('container-kelas-checkbox');
  if(!container) return;
  
  if (daftarSemuaKelas.length === 0) {
    container.innerHTML = '<span style="color:#ef4444; font-size:0.875rem;">Data kelas belum ada. Silakan buat dahulu di menu Manajemen Kelas.</span>';
    return;
  }
  
  container.innerHTML = '';
  daftarSemuaKelas.forEach((k, idx) => {
    const isChecked = currentAllowedKelasArray.includes(String(k.nama));
    const wrapper = document.createElement('div');
    const id = `cb-kelas-${idx}`;
    
    wrapper.innerHTML = `
      <input type="checkbox" id="${id}" class="chip-checkbox cb-kelas-filter" value="${k.nama}" ${isChecked ? 'checked' : ''} onchange="updateCheckedKelasIcon(this)">
      <label for="${id}" class="chip-label">
        <i class="fas fa-check" style="display: ${isChecked ? 'inline-block' : 'none'};"></i> ${k.nama}
      </label>
    `;
    container.appendChild(wrapper);
  });
}

function updateCheckedKelasIcon(cb) {
  const icon = cb.nextElementSibling.querySelector('i');
  if (cb.checked) {
    icon.style.display = 'inline-block';
  } else {
    icon.style.display = 'none';
  }
}


function showTokenPresentation() {
  const tokenInput = document.getElementById('conf-token').value;
  if (!tokenInput) {
    showToast('Token masih kosong!', 'error');
    return;
  }
  document.getElementById('display-token-text').innerText = tokenInput;
  const overlay = document.getElementById('token-presentation-overlay');
  overlay.classList.remove('hidden');
  
  if (typeof trapFocus === 'function') {
    trapFocus(overlay);
  }
}

function closeTokenPresentation() {
  const overlay = document.getElementById('token-presentation-overlay');
  overlay.classList.add('hidden');
  if (typeof untrapFocus === 'function') {
    untrapFocus(overlay);
  }
}

function generateRandomToken() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; 
  let token = '';
  for (let i = 0; i < 6; i++) {
    token += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  document.getElementById('conf-token').value = token;
}

function saveConfig() {
  const btn = document.getElementById('btn-save-config');
  btn.disabled = true;
  btn.innerText = 'Menyimpan...';
  
  
  const checkedBoxes = document.querySelectorAll('.cb-kelas-filter:checked');
  const allowed = Array.from(checkedBoxes).map(cb => cb.value).join(',');
  document.getElementById('conf-kelas-diizinkan').value = allowed;

  const isPaket = document.getElementById('mode-paket').checked;
  const mapelVal = isPaket ? '' : document.getElementById('conf-mapel-ujian').value;
  const paketVal = isPaket ? document.getElementById('conf-paket-ujian').value : '';
  
  if (isPaket && !paketVal) {
    showToast('Harap pilih paket soal.', 'error');
    btn.disabled = false;
    btn.innerText = 'Simpan Pengaturan';
    return;
  }

  const payload = {
    aktif: document.getElementById('conf-aktif-toggle').checked,
    durasi: parseInt(document.getElementById('conf-durasi').value, 10),
    token: document.getElementById('conf-token').value.toUpperCase(),
    kelas_diizinkan: allowed,
    acak_soal: document.getElementById('conf-acak-toggle').checked,
    waktu_mulai: document.getElementById('conf-waktu-mulai').value,
    waktu_selesai: document.getElementById('conf-waktu-selesai').value,
    nama_ujian: document.getElementById('conf-nama-ujian').value,
    mapel_ujian: mapelVal,
    paket_ujian: paketVal
  };
  
  api.call('executeAdminAction', AppStore.user.data.token, 'setConfig', { config: payload }).then(res => {
    if (res.success) {
      showToast('Pengaturan ujian berhasil diupdate', 'success');
      
      if (res.config) {
        document.getElementById('conf-token').value = res.config.token;
      }
    } else {
      showToast(res.message || 'Gagal menyimpan', 'error');
    }
  }).finally(() => {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-save"></i> Simpan Pengaturan Server';
  });
}

function toggleStatusText() {
  const toggle = document.getElementById('conf-aktif-toggle');
  const label = document.getElementById('statusLabel');
  if (toggle) {
    if (toggle.checked) {
      label.innerText = 'AKTIF (Siswa Bisa Login)';
      label.style.color = '#10B981';
    } else {
      label.innerText = 'DITUTUP';
      label.style.color = '#EF4444';
    }
  }
}

function toggleAcakText() {
  const toggle = document.getElementById('conf-acak-toggle');
  const label = document.getElementById('acakLabel');
  if (toggle) {
    if (toggle.checked) {
      label.innerText = 'DIACAK (Berbeda per Siswa)';
      label.style.color = '#10B981';
    } else {
      label.innerText = 'TIDAK DIACAK';
      label.style.color = '#EF4444';
    }
  }
}
</script>

function normalizeQuestionExcelHeader(value) {
  return String(value == null ? '' : value).trim().toLowerCase().replace(/[^a-z0-9]/g, '');
}

function findQuestionHeaderIndex(rows) {
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const normalized = (rows[i] || []).map(normalizeQuestionExcelHeader);
    if (normalized.includes('tipe') && normalized.includes('pertanyaan')) return i;
  }
  return -1;
}

function getQuestionColumnIndex(headers, aliases) {
  for (let i = 0; i < headers.length; i++) {
    if (aliases.includes(headers[i])) return i;
  }
  return -1;
}

function normalizeExcelDriveReference(value) {
  const raw = String(value == null ? '' : value).trim();
  if (!raw) return '';
  if (raw.indexOf('DRIVE_ID:') === 0) return raw;
  let match = raw.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/i);
  if (!match) match = raw.match(/[?&]id=([a-zA-Z0-9_-]+)/i);
  if (!match && /^[a-zA-Z0-9_-]{10,}$/.test(raw)) return 'DRIVE_ID:' + raw;
  if (match && /(^https?:\/\/)?(www\.)?drive\.google\.com/i.test(raw)) return 'DRIVE_ID:' + match[1];
  throw new Error('Tautan gambar harus berupa tautan file Google Drive yang valid: ' + raw);
}

function driveReferenceToExcelLink(reference) {
  const raw = String(reference == null ? '' : reference).trim();
  if (!raw) return '';
  if (raw.indexOf('DRIVE_ID:') === 0) {
    const id = raw.substring('DRIVE_ID:'.length);
    return id ? 'https://drive.google.com/file/d/' + id + '/view?usp=sharing' : '';
  }
  if (/^https?:\/\/drive\.google\.com/i.test(raw)) return raw;
  if (/^[a-zA-Z0-9_-]{10,}$/.test(raw)) return 'https://drive.google.com/file/d/' + raw + '/view?usp=sharing';
  return raw;
}

function splitQuestionPipe(value) {
  const text = String(value == null ? '' : value);
  return text === '' ? [] : text.split('|').map(item => item.trim());
}

function normalizeQuestionType(value) {
  const text = String(value == null ? '' : value).trim().toLowerCase().replace(/[\/_-]/g, ' ').replace(/\s+/g, ' ');
  if (text === 'pg' || text === 'pilihan ganda') return 'PG';
  if (text === 'pg kompleks' || text === 'pilihan ganda kompleks') return 'PG Kompleks';
  if (text === 'isian singkat' || text === 'isian') return 'Isian Singkat';
  if (text === 'menjodohkan' || text === 'matching') return 'Menjodohkan';
  if (text === 'benar salah' || text === 'true false' || text === 'true/false') return 'Benar Salah';
  if (text === 'sesuai tidak sesuai' || text === 'sesuai/tidak sesuai') return 'Sesuai Tidak Sesuai';
  return '';
}

function questionKeyFromExcel(rawKey, options, allowMultiple) {
  const rawKeys = allowMultiple ? splitQuestionPipe(rawKey) : [String(rawKey == null ? '' : rawKey).trim()];
  const mapOne = function(key) {
    const value = String(key == null ? '' : key).trim();
    if (!value) return '';
    if (/^[A-E]$/i.test(value)) {
      const index = value.toUpperCase().charCodeAt(0) - 65;
      return options[index] || value;
    }
    return value;
  };
  return allowMultiple ? rawKeys.map(mapOne).filter(Boolean) : mapOne(rawKeys[0]);
}

function parseQuestionRowFromExcel(row, col, excelRowNumber) {
  const get = function(key) {
    const index = col[key];
    return index >= 0 && row[index] != null ? String(row[index]).trim() : '';
  };

  const tipe = normalizeQuestionType(get('tipe'));
  const pertanyaan = get('pertanyaan');
  const bobot = get('bobot') === '' ? 1 : Number(get('bobot'));
  const mapel = get('mapel');
  const petunjuk = get('petunjuk');
  const teksPendukung = get('teks_pendukung');
  const urlGambar = normalizeExcelDriveReference(get('url_gambar'));
  const opsiRaw = get('opsi');
  const gambarOpsiRaw = get('opsi_gambar');
  const kunciRaw = get('kunci_jawaban');

  if (!tipe) throw new Error('Baris ' + excelRowNumber + ': tipe soal tidak dikenali.');
  if (!pertanyaan) throw new Error('Baris ' + excelRowNumber + ': pertanyaan wajib diisi.');
  if (!Number.isFinite(bobot) || bobot < 1) throw new Error('Baris ' + excelRowNumber + ': bobot minimal 1.');

  let opsi = [];
  let opsiGambar = [];
  let kunciJawaban = null;

  if (tipe === 'PG' || tipe === 'PG Kompleks' || tipe === 'Benar Salah' || tipe === 'Sesuai Tidak Sesuai') {
    opsi = splitQuestionPipe(opsiRaw);
    const imageLinks = splitQuestionPipe(gambarOpsiRaw).map(normalizeExcelDriveReference);
    const total = Math.max(opsi.length, imageLinks.length);
    for (let i = 0; i < total; i++) {
      const text = opsi[i] || '';
      const image = imageLinks[i] || '';
      if (!text && !image) throw new Error('Baris ' + excelRowNumber + ': opsi ke-' + (i + 1) + ' kosong (isi teks atau link gambar).');
      opsi[i] = text || '__CBT_IMAGE_OPTION_' + (i + 1) + '__';
      opsiGambar[i] = image;
    }

    if (tipe === 'PG') {
      if (opsi.length < 2) throw new Error('Baris ' + excelRowNumber + ': PG minimal memiliki 2 opsi.');
      kunciJawaban = questionKeyFromExcel(kunciRaw, opsi, false);
      if (!kunciJawaban || !opsi.includes(kunciJawaban)) throw new Error('Baris ' + excelRowNumber + ': kunci PG harus sama dengan salah satu opsi atau berupa huruf A-E.');
    } else if (tipe === 'PG Kompleks') {
      if (opsi.length < 2) throw new Error('Baris ' + excelRowNumber + ': PG Kompleks minimal memiliki 2 opsi.');
      kunciJawaban = questionKeyFromExcel(kunciRaw, opsi, true);
      if (!kunciJawaban.length || kunciJawaban.some(key => !opsi.includes(key))) throw new Error('Baris ' + excelRowNumber + ': kunci PG Kompleks tidak sesuai dengan opsi.');
    } else {
      if (opsi.length !== 3) throw new Error('Baris ' + excelRowNumber + ': kategori pernyataan harus tepat 3.');
      if (tipe === 'Sesuai Tidak Sesuai') {
        kunciJawaban = splitQuestionPipe(kunciRaw).map(value => value.toLowerCase() === 'sesuai' ? 'Sesuai' : value.toLowerCase() === 'tidak sesuai' ? 'Tidak Sesuai' : '');
        if (kunciJawaban.length !== 3 || kunciJawaban.some(value => !value)) throw new Error('Baris ' + excelRowNumber + ': kunci harus Sesuai atau Tidak Sesuai.');
      } else {
        kunciJawaban = splitQuestionPipe(kunciRaw).map(value => {
          const normalized = value.toLowerCase();
          if (normalized === 'true') return 'Benar';
          if (normalized === 'false') return 'Salah';
          return normalized === 'benar' ? 'Benar' : normalized === 'salah' ? 'Salah' : '';
        });
        if (kunciJawaban.length !== 3 || kunciJawaban.some(value => !value) ||
            kunciJawaban.filter(value => value === 'Benar').length !== 2 ||
            kunciJawaban.filter(value => value === 'Salah').length !== 1) {
          throw new Error('Baris ' + excelRowNumber + ': kunci Benar/Salah harus terdiri dari 2 Benar dan 1 Salah.');
        }
      }
    }
  } else if (tipe === 'Menjodohkan') {
    const pairValues = splitQuestionPipe(opsiRaw);
    const imagePairs = splitQuestionPipe(gambarOpsiRaw);
    const total = Math.max(pairValues.length, imagePairs.length);
    for (let i = 0; i < total; i++) {
      const parts = (pairValues[i] || ':::').split(':::');
      const imageParts = (imagePairs[i] || ':::').split(':::');
      let left = (parts[0] || '').trim();
      let right = parts.slice(1).join(':::').trim();
      const leftImage = normalizeExcelDriveReference(imageParts[0] || '');
      const rightImage = normalizeExcelDriveReference(imageParts.slice(1).join(':::') || '');
      if (!left && !leftImage) throw new Error('Baris ' + excelRowNumber + ': sisi kiri pasangan ' + (i + 1) + ' kosong.');
      if (!right && !rightImage) throw new Error('Baris ' + excelRowNumber + ': sisi kanan pasangan ' + (i + 1) + ' kosong.');
      if (!left) left = '__CBT_IMAGE_MATCH_LEFT_' + (i + 1) + '__';
      if (!right) right = '__CBT_IMAGE_MATCH_RIGHT_' + (i + 1) + '__';
      opsi.push(left + ':::' + right);
      opsiGambar.push({ kunci: leftImage, nilai: rightImage });
    }

    const keyPairs = splitQuestionPipe(kunciRaw).filter(function(pair) {
      const parts = String(pair).split(':::');
      return String(parts[0] || '').trim() && String(parts.slice(1).join(':::') || '').trim();
    });
    kunciJawaban = {};
    const sourcePairs = keyPairs.length ? keyPairs : opsi;
    sourcePairs.forEach(function(pair) {
      const parts = String(pair).split(':::');
      const left = (parts[0] || '').trim();
      const right = parts.slice(1).join(':::').trim();
      if (left && right) kunciJawaban[left] = right;
    });
    if (Object.keys(kunciJawaban).length < 2) throw new Error('Baris ' + excelRowNumber + ': Menjodohkan minimal memiliki 2 pasangan kunci dengan format kiri:::kanan.');
  } else if (tipe === 'Isian Singkat') {
    opsi = [];
    opsiGambar = [];
    kunciJawaban = kunciRaw;
    if (tipe === 'Isian Singkat' && !String(kunciJawaban || '').trim()) {
      throw new Error('Baris ' + excelRowNumber + ': kunci jawaban Isian Singkat wajib diisi.');
    }
  }

  return {
    tipe: tipe,
    pertanyaan: pertanyaan,
    petunjuk: petunjuk,
    teks_pendukung: teksPendukung,
    opsi: opsi,
    opsi_gambar: opsiGambar,
    kunci_jawaban: kunciJawaban,
    bobot: bobot,
    url_gambar: urlGambar,
    mapel: mapel
  };
}

function parseImportedXlsxWorkbook(workbook) {
  const preferredNames = ['Template_Soal', 'Bank_Soal'];
  let selectedSheetName = preferredNames.find(name => workbook.Sheets[name]);
  let rows = null;
  let headerIndex = -1;

  const candidates = selectedSheetName
    ? [selectedSheetName].concat(workbook.SheetNames.filter(name => name !== selectedSheetName))
    : workbook.SheetNames;

  for (const name of candidates) {
    const candidateRows = XLSX.utils.sheet_to_json(workbook.Sheets[name], {
      header: 1, raw: false, defval: '', blankrows: false
    });
    const candidateHeader = findQuestionHeaderIndex(candidateRows);
    if (candidateHeader >= 0) {
      selectedSheetName = name;
      rows = candidateRows;
      headerIndex = candidateHeader;
      break;
    }
  }
  if (!rows || headerIndex < 0) {
    throw new Error('Header soal tidak ditemukan. Gunakan template Excel CBT-GAS.');
  }

  const headers = rows[headerIndex].map(normalizeQuestionExcelHeader);
  const aliases = {
    tipe: ['tipe', 'jenissoal', 'type'],
    petunjuk: ['petunjuk', 'perintah', 'instruksi'],
    teks_pendukung: ['tekspendukung', 'bacaan', 'pengantar'],
    pertanyaan: ['pertanyaan', 'soal'],
    url_gambar: ['linkgambarsoal', 'urlgambar', 'gambarsoal'],
    opsi: ['opsi', 'pilihanjawaban'],
    opsi_gambar: ['linkgambaropsi', 'gambaropsi', 'opsigambar'],
    kunci_jawaban: ['kuncijawaban', 'kunci', 'jawabanbenar'],
    bobot: ['bobot', 'nilai'],
    mapel: ['matapelajaran', 'mapel', 'subject']
  };
  const col = {};
  Object.keys(aliases).forEach(key => {
    col[key] = getQuestionColumnIndex(headers, aliases[key]);
  });
  if (col.tipe < 0 || col.pertanyaan < 0) {
    throw new Error('Kolom Tipe dan Pertanyaan wajib tersedia.');
  }

  parsedImportData = [];
  const errors = [];
  const preview = [];
  let counts = { PG: 0, 'PG Kompleks': 0, 'Isian Singkat': 0, 'Benar Salah': 0, 'Menjodohkan': 0, 'Sesuai Tidak Sesuai': 0 };

  for (let i = headerIndex + 1; i < rows.length; i++) {
    const row = rows[i] || [];
    if (!row.some(value => String(value == null ? '' : value).trim() !== '')) continue;
    try {
      const question = parseQuestionRowFromExcel(row, col, i + 1);
      parsedImportData.push(question);
      counts[question.tipe] = (counts[question.tipe] || 0) + 1;
      if (preview.length < 5) preview.push({ question: question, error: '' });
    } catch (error) {
      errors.push(error.message);
      if (preview.length < 5) preview.push({ question: { tipe: String(row[col.tipe] || 'Tidak diketahui'), pertanyaan: String(row[col.pertanyaan] || '') }, error: error.message });
    }
  }

  questionImportHasErrors = errors.length > 0;
  document.getElementById('preview-total').innerText = 'Total Valid: ' + parsedImportData.length;
  document.getElementById('preview-pg').innerText = 'PG: ' + (counts.PG || 0);
  document.getElementById('preview-pgc').innerText = 'PG Kompleks: ' + (counts['PG Kompleks'] || 0);
  document.getElementById('preview-isian').innerText = 'Isian Singkat: ' + (counts['Isian Singkat'] || 0);
  document.getElementById('preview-benarsalah').innerText = 'Benar/Salah: ' + (counts['Benar Salah'] || 0);
  document.getElementById('preview-menjodohkan').innerText = 'Menjodohkan: ' + (counts.Menjodohkan || 0);
  document.getElementById('preview-sesuai').innerText = 'Sesuai/Tidak Sesuai: ' + (counts['Sesuai Tidak Sesuai'] || 0);

  const errorBadge = document.getElementById('preview-error');
  if (errors.length) {
    errorBadge.innerText = 'Error: ' + errors.length;
    errorBadge.style.display = 'inline-block';
  } else {
    errorBadge.style.display = 'none';
  }

  const previewBody = document.getElementById('import-preview-tbody');
  previewBody.innerHTML = '';
  preview.forEach(function(item) {
    const tr = document.createElement('tr');
    if (item.error) tr.style.background = '#FEE2E2';
    [item.question.tipe, String(item.question.pertanyaan || '').replace(/<[^>]*>/g, ' ').slice(0, 120),
      item.error ? item.error : (item.question.opsi || []).map(value => String(value).replace(/<[^>]*>/g, '')).join(' | '),
      item.error ? 'Perlu diperbaiki' : (Array.isArray(item.question.kunci_jawaban) ? item.question.kunci_jawaban.join(' | ') : typeof item.question.kunci_jawaban === 'object' ? 'Pasangan' : String(item.question.kunci_jawaban || '-'))]
      .forEach(function(value) {
        const td = document.createElement('td');
        td.style.cssText = 'padding:8px; border-bottom:1px solid #E5E7EB; max-width:220px; overflow:hidden; text-overflow:ellipsis;';
        td.textContent = value;
        tr.appendChild(td);
      });
    previewBody.appendChild(tr);
  });
  if (parsedImportData.length > 5) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 4;
    td.style.cssText = 'padding:8px; text-align:center; color:#64748B;';
    td.textContent = 'Dan ' + (parsedImportData.length - 5) + ' soal valid lainnya.';
    tr.appendChild(td);
    previewBody.appendChild(tr);
  }

  if (errors.length) {
    showToast(errors.slice(0, 3).join(' '), 'error');
  } else if (!parsedImportData.length) {
    showToast('Tidak ada baris soal yang dapat diimpor pada sheet ' + selectedSheetName + '.', 'error');
  }
  document.getElementById('import-soal-preview').classList.remove('hidden');
  document.getElementById('btn-import-soal').disabled = parsedImportData.length === 0 || questionImportHasErrors;
}

function questionKeyToExcel(value, options) {
  const token = String(value == null ? '' : value).match(/^__CBT_IMAGE_OPTION_(\d+)__$/);
  if (token) return String.fromCharCode(64 + Number(token[1]));
  return String(value == null ? '' : value);
}

function exportBankSoalExcel() {
  if (typeof XLSX === 'undefined') {
    showToast('Library Excel belum berhasil dimuat. Muat ulang halaman.', 'error');
    return;
  }
  const button = document.querySelector('.page-header-actions button[onclick="exportBankSoalExcel()"]');
  const originalText = button ? button.innerHTML : '';
  if (button) {
    button.disabled = true;
    button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyiapkan...';
  }

  api.call('executeAdminAction', AppStore.user.data.token, 'exportSoal', {}).then(function(questions) {
    if (!Array.isArray(questions)) throw new Error((questions && questions.message) || 'Bank soal tidak dapat diakses.');
    const rows = [QUESTION_EXCEL_HEADERS];
    (Array.isArray(questions) ? questions : []).forEach(function(question) {
      const type = question.tipe || '';
      const options = Array.isArray(question.opsi) ? question.opsi : [];
      const images = Array.isArray(question.opsi_gambar) ? question.opsi_gambar : [];
      let optionsCell = '';
      let imagesCell = '';
      let keysCell = '';

      if (type === 'Menjodohkan') {
        optionsCell = options.map(function(pair) {
          const parts = String(pair || '').split(':::');
          return [visibleOptionText(parts[0] || ''), visibleOptionText(parts.slice(1).join(':::'))].join(':::');
        }).join('|');
        imagesCell = images.map(function(image) {
          const item = image && typeof image === 'object' ? image : {};
          return driveReferenceToExcelLink(item.kunci || '') + ':::' + driveReferenceToExcelLink(item.nilai || '');
        }).join('|');
        const keyObject = question.kunci_jawaban && typeof question.kunci_jawaban === 'object' ? question.kunci_jawaban : {};
        keysCell = Object.keys(keyObject).map(key => visibleOptionText(key) + ':::' + visibleOptionText(keyObject[key])).join('|');
      } else {
        optionsCell = options.map(value => visibleOptionText(value)).join('|');
        imagesCell = images.map(value => driveReferenceToExcelLink(typeof value === 'string' ? value : '')).join('|');
        if (Array.isArray(question.kunci_jawaban)) {
          keysCell = question.kunci_jawaban.map(value => questionKeyToExcel(value, options)).join('|');
        } else {
          keysCell = questionKeyToExcel(question.kunci_jawaban, options);
        }
      }

      rows.push([
        type,
        question.petunjuk || '',
        question.teks_pendukung || '',
        question.pertanyaan || '',
        driveReferenceToExcelLink(question.url_gambar || ''),
        optionsCell,
        imagesCell,
        keysCell,
        Number(question.bobot || 1),
        question.mapel || ''
      ]);
    });

    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, questionWorkbookSheet(rows, 'Bank_Soal'), 'Bank_Soal');
    const guideRows = [
      ['PANDUAN FILE EXPORT BANK SOAL'],
      ['File ini berisi seluruh soal pada bank soal. Untuk mengimpor kembali, gunakan sheet Bank_Soal.'],
      ['Tautan gambar diekspor sebagai tautan Google Drive. Pastikan file tetap dapat diakses oleh akun pemilik aplikasi.'],
      ['Jangan mengubah struktur header kolom.']
    ];
    XLSX.utils.book_append_sheet(workbook, questionWorkbookSheet(guideRows, 'Panduan'), 'Panduan');
    const dateTag = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(workbook, 'Export_Bank_Soal_CBT_' + dateTag + '.xlsx');
    showToast(rows.length - 1 + ' soal berhasil diekspor.', 'success');
  }).catch(function(error) {
    console.error('Export bank soal gagal:', error);
    showToast(error && error.message ? error.message : 'Gagal mengambil data bank soal untuk diekspor.', 'error');
  }).finally(function() {
    if (button) {
      button.disabled = false;
      button.innerHTML = originalText;
    }
  });
}

function handleDragOver(e) {
  e.stopPropagation();
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  document.getElementById('import-dropzone').style.backgroundColor = '#E5E7EB';
}

function handleDragLeave(e) {
  e.stopPropagation();
  e.preventDefault();
  document.getElementById('import-dropzone').style.backgroundColor = '#F9FAFB';
}

function handleFileDrop(e) {
  e.stopPropagation();
  e.preventDefault();
  document.getElementById('import-dropzone').style.backgroundColor = '#F9FAFB';
  
  const files = e.dataTransfer.files;
  if (files && files.length > 0) {
    document.getElementById('import-file-input').files = files;
    handleImportFileSelected({ target: { files: files } });
  }
}

function handleImportFileSelected(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  parsedImportData = [];
  questionImportHasErrors = true;
  document.getElementById('btn-import-soal').disabled = true;
  document.getElementById('import-soal-preview').classList.add('hidden');

  if (file.size > 10 * 1024 * 1024) {
    showToast('Ukuran file maksimal 10 MB.', 'error');
    return;
  }

  document.getElementById('preview-filename').innerText = file.name;
  if (/\.xlsx$/i.test(file.name)) {
    if (typeof XLSX === 'undefined') {
      showToast('Library Excel belum berhasil dimuat. Muat ulang halaman.', 'error');
      return;
    }
    const reader = new FileReader();
    reader.onload = function(loadEvent) {
      try {
        const workbook = XLSX.read(loadEvent.target.result, { type: 'array', cellText: true, cellDates: false });
        parseImportedXlsxWorkbook(workbook);
      } catch (error) {
        console.error('Gagal membaca workbook soal:', error);
        showToast(error.message || 'File Excel tidak dapat dibaca.', 'error');
      }
    };
    reader.onerror = function() {
      showToast('Gagal membaca file Excel.', 'error');
    };
    reader.readAsArrayBuffer(file);
    return;
  }

  if (/\.csv$/i.test(file.name) || file.type === 'text/csv' || file.type === 'application/vnd.ms-excel') {
    const reader = new FileReader();
    reader.onload = function(loadEvent) {
      parseImportedCsvText(loadEvent.target.result);
    };
    reader.onerror = function() {
      showToast('Gagal membaca file CSV.', 'error');
    };
    reader.readAsText(file);
    return;
  }

  showToast('Format file harus .xlsx atau .csv.', 'error');
}

function parseImportedCsvText(text) {
  questionImportHasErrors = false;
  const lines = text.split('\n');
  parsedImportData = [];
  const previewRows = [];
  let errorCount = 0;
  
  let pg = 0, pgc = 0, isian = 0, benarsalah = 0, sesuai = 0, total = 0;
  
  let startIndex = 0;
  if (lines.length > 0 && lines[0].toLowerCase().includes('tipe') && lines[0].toLowerCase().includes('pertanyaan')) {
    startIndex = 1;
  }
  
  for (let i = startIndex; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    
    let cols = [];
    if (line.includes('\t')) {
      cols = line.split('\t');
    } else {
      let inQuotes = false;
      let currentWord = '';
      for (let j = 0; j < line.length; j++) {
        let char = line[j];
        if (char === '"') {
           if (inQuotes && line[j + 1] === '"') {
             currentWord += '"';
             j++;
           } else {
             inQuotes = !inQuotes;
           }
        } else if (char === ',' && !inQuotes) {
           cols.push(currentWord.trim());
           currentWord = '';
        } else {
           currentWord += char;
        }
      }
      cols.push(currentWord.trim());
    }
    
    if (cols.length < 2) continue;
    
    let tipeStr = cols[0].toLowerCase();
    let tipe = '';
    
    if (tipeStr === 'pg' || tipeStr === 'pilihan ganda') tipe = 'PG';
    else if (tipeStr === 'pg kompleks' || tipeStr === 'pilihan ganda kompleks') tipe = 'PG Kompleks';
    else if (tipeStr === 'isian singkat') tipe = 'Isian Singkat';
    else if (tipeStr === 'benar salah' || tipeStr === 'benar/salah' || tipeStr === 'true false') tipe = 'Benar Salah';
    else if (tipeStr === 'sesuai tidak sesuai' || tipeStr === 'sesuai/tidak sesuai') tipe = 'Sesuai Tidak Sesuai';
    
    const pertanyaan = cols[1] ? cols[1] : '';
    const opsiRaw = cols[2] ? cols[2] : '';
    const kunciRaw = cols[3] ? cols[3] : '';
    const bobot = cols[4] ? (Number(cols[4]) || 1) : 1;
    const mapel = cols[5] ? cols[5] : '';
    
    let hasError = false;
    let errMsg = '';
    
    if (!tipe) {
      hasError = true;
      errMsg = 'Tipe tidak valid';
    } else if (!pertanyaan) {
      hasError = true;
      errMsg = 'Pertanyaan kosong';
    }
    
    let opsiArray = [];
    let kunciJawaban = null;
    
    if (!hasError) {
      if (tipe === 'PG') {
        if (opsiRaw) opsiArray = opsiRaw.split('|').map(s => s.trim());
        kunciJawaban = kunciRaw;
        pg++;
      } 
      else if (tipe === 'PG Kompleks') {
        if (opsiRaw) opsiArray = opsiRaw.split('|').map(s => s.trim());
        if (kunciRaw) kunciJawaban = kunciRaw.split('|').map(s => s.trim());
        else kunciJawaban = [];
        pgc++;
      }
      else if (tipe === 'Isian Singkat') {
        opsiArray = [];
        kunciJawaban = kunciRaw;
        isian++;
      }
      else if (tipe === 'Benar Salah') {
        opsiArray = opsiRaw.split('|').map(s => s.trim());
        kunciJawaban = kunciRaw.split('|').map(s => s.trim());
        const validKeys = kunciJawaban.map(s => s.toLowerCase());
        if (opsiArray.length !== 3 || opsiArray.some(s => !s) || validKeys.length !== 3 || validKeys.filter(s => s === 'benar').length !== 2 || validKeys.filter(s => s === 'salah').length !== 1) {
          hasError = true;
          errMsg = 'Benar Salah harus 3 pernyataan, 2 kunci Benar, dan 1 kunci Salah';
        } else {
          kunciJawaban = validKeys.map(s => s === 'benar' ? 'Benar' : 'Salah');
          benarsalah++;
        }
      }
      else if (tipe === 'Sesuai Tidak Sesuai') {
        opsiArray = opsiRaw.split('|').map(s => s.trim());
        kunciJawaban = kunciRaw.split('|').map(s => s.trim().toLowerCase() === 'sesuai' ? 'Sesuai' : s.trim().toLowerCase() === 'tidak sesuai' ? 'Tidak Sesuai' : '');
        if (opsiArray.length !== 3 || opsiArray.some(s => !s) || kunciJawaban.length !== 3 || kunciJawaban.some(s => !s)) {
          hasError = true; errMsg = 'Sesuai/Tidak Sesuai membutuhkan 3 pernyataan dan 3 kunci valid.';
        } else sesuai++;
      }

      
      if (hasError) {
        errorCount++;
      } else {
        parsedImportData.push({
          tipe: tipe,
          pertanyaan: pertanyaan,
          opsi: opsiArray,
          kunci_jawaban: kunciJawaban,
          bobot: bobot,
          mapel: mapel
        });
        total++;
      }
    } else {
      errorCount++;
    }
    
    if (previewRows.length < 5) {
      previewRows.push(`
        <tr style="${hasError ? 'background-color: #FEE2E2;' : ''}">
          <td style="padding: 8px; border-bottom: 1px solid #E5E7EB; font-size: 0.75rem;">${hasError ? `<span style="color:red" title="${errMsg}">⚠ ${tipeStr}</span>` : tipe}</td>
          <td style="padding: 8px; border-bottom: 1px solid #E5E7EB; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${typeof FrontendSecurity !== 'undefined' ? FrontendSecurity.renderSafeHtml(pertanyaan) : pertanyaan}</td>
          <td style="padding: 8px; border-bottom: 1px solid #E5E7EB; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${opsiRaw || '-'}</td>
          <td style="padding: 8px; border-bottom: 1px solid #E5E7EB; max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${kunciRaw || '-'}</td>
        </tr>
      `);
    }
  }
  
  if (total > 5) {
    previewRows.push(`
      <tr>
        <td colspan="4" style="padding: 8px; text-align: center; color: #6B7280; font-style: italic;">... dan ${total - 5} baris valid lainnya</td>
      </tr>
    `);
  }
  
  document.getElementById('preview-total').innerText = 'Total Valid: ' + total;
  document.getElementById('preview-pg').innerText = 'PG: ' + pg;
  document.getElementById('preview-pgc').innerText = 'PG Kompleks: ' + pgc;
  document.getElementById('preview-isian').innerText = 'Isian Singkat: ' + isian;
  const bsBadge = document.getElementById('preview-benarsalah');
  if (bsBadge) bsBadge.innerText = 'Benar/Salah: ' + benarsalah;
  document.getElementById('preview-sesuai').innerText = 'Sesuai/Tidak Sesuai: ' + sesuai;
  
  const errBadge = document.getElementById('preview-error');
  if (errorCount > 0) {
    errBadge.innerText = 'Error (Dilewati): ' + errorCount;
    errBadge.style.display = 'inline-block';
  } else {
    errBadge.style.display = 'none';
  }
  
  document.getElementById('import-preview-tbody').innerHTML = previewRows.join('') || '<tr><td colspan="4" style="text-align:center; padding: 10px;">Tidak ada data</td></tr>';
  document.getElementById('import-soal-preview').classList.remove('hidden');
  
  questionImportHasErrors = errorCount > 0;
  document.getElementById('btn-import-soal').disabled = total === 0 || questionImportHasErrors;
}

async function processImportFromFile() {
  if (parsedImportData.length === 0 || questionImportHasErrors) {
    showToast('Perbaiki kesalahan pada file sebelum melakukan import.', 'error');
    return;
  }

  const btn = document.getElementById('btn-import-soal');
  const originalText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';

  let imported = 0;
  try {
    for (let start = 0; start < parsedImportData.length; start += 50) {
      const chunk = parsedImportData.slice(start, start + 50);
      const result = await api.call('executeAdminAction', AppStore.user.data.token, 'importSoal', { dataArray: chunk });
      if (!result || !result.success) {
        throw new Error((result && result.message) || 'Server menolak data soal.');
      }
      imported += Number(result.count || 0);
    }
    showToast(imported + ' soal berhasil diimport dan disimpan ke Bank Soal.', 'success');
    closeImportSoalModal();
    loadBankSoal();
  } catch (error) {
    console.error('Import soal gagal:', error);
    showToast('Import berhenti. ' + error.message + ' Soal yang sudah berhasil diproses: ' + imported + '.', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
}

function switchTab(tab) {
  const btnBank = document.getElementById('tab-bank-soal');
  const btnPaket = document.getElementById('tab-paket-soal');
  const contBank = document.getElementById('container-bank-soal');
  const contPaket = document.getElementById('container-paket-soal');
  const actionsBank = document.getElementById('bank-soal-actions');
  const actionsPaket = document.getElementById('paket-soal-actions');

  if (tab === 'bank') {
    btnBank.classList.add('active');
    btnPaket.classList.remove('active');
    contBank.classList.remove('hidden');
    contPaket.classList.add('hidden');
    actionsBank.classList.remove('hidden');
    actionsPaket.classList.add('hidden');
    loadBankSoal();
  } else {
    btnBank.classList.remove('active');
    btnPaket.classList.add('active');
    contBank.classList.add('hidden');
    contPaket.classList.remove('hidden');
    actionsBank.classList.add('hidden');
    actionsPaket.classList.remove('hidden');
    loadPaketSoal();
  }
}

function loadPaketSoal() {
  api.call('executeAdminAction', AppStore.user.data.token, 'getAllPaketSoal', { bypassCache: true }).then(res => {
    console.log('GetAllPaketSoal Response:', res);
    if (Array.isArray(res)) {
      AppStore.paketList = res;
    } else if (res && res.success === false) {
      showToast('Gagal: ' + res.message, 'error');
      AppStore.paketList = [];
    } else {
      AppStore.paketList = [];
    }
    renderTabelPaket();
  }).catch(err => {
    console.error('GetAllPaketSoal Error:', err);
    showToast('Gagal memuat daftar paket soal', 'error');
  });
}

function renderTabelPaket() {
  if ($.fn.DataTable.isDataTable('#tbl-paket')) {
    $('#tbl-paket').DataTable().destroy();
  }

  const tbody = document.querySelector('#tbl-paket tbody');
  tbody.innerHTML = '';

  if (!AppStore.paketList || AppStore.paketList.length === 0) {
    tbody.innerHTML = getEmptyStateHtml(6, 'Belum ada paket soal tersimpan.', 'fa-layer-group');
    return;
  }

  AppStore.paketList.forEach((paket, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${idx + 1}</td>
      <td><strong>${paket.nama_paket}</strong></td>
      <td><span class="badge badge-info">${(paket.soal_ids || []).length}</span></td>
      <td><span style="font-size: 0.85rem; color: #6B7280;">${paket.deskripsi || '-'}</span></td>
      <td><span style="font-size: 0.8rem;">${paket.dibuat_pada || '-'}</span></td>
      <td style="white-space:nowrap; text-align:center;">
        <div style="display:flex; justify-content:center; gap:0.25rem;">
          <button class="btn btn-outline" style="padding:0.25rem 0.5rem;" onclick="editPaket('${paket.id_paket}')"><i class="fas fa-edit" style="color:var(--primary)"></i></button>
          <button class="btn btn-outline" style="padding:0.25rem 0.5rem;" onclick="deletePaket('${paket.id_paket}')"><i class="fas fa-trash" style="color:var(--danger)"></i></button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });

  $('#tbl-paket').DataTable({
    language: {
      search: 'Cari:',
      lengthMenu: 'Tampilkan _MENU_ data',
      info: 'Menampilkan _START_ sampai _END_ dari _TOTAL_ data',
      infoEmpty: 'Tidak ada data tersedia',
      paginate: { first: 'Pertama', last: 'Terakhir', next: '&rsaquo;', previous: '&lsaquo;' },
      zeroRecords: 'Tidak ditemukan data yang sesuai'
    },
    columnDefs: [
      { orderable: false, targets: [0, 5] }
    ],
    pageLength: 10
  });
}

let currentSelectedSoalIds = [];

function openPaketModal() {
  document.getElementById('modal-paket-title').innerText = 'Buat Paket Soal Baru';
  document.getElementById('frm-paket').reset();
  document.getElementById('paket-id').value = '';
  document.getElementById('paket-count-terpilih').innerText = '0';
  document.getElementById('paket-filter-mapel').value = '';
  document.getElementById('chk-all-pilihan-soal').checked = false;
  
  currentSelectedSoalIds = [];
  renderPilihanSoal();
  
  document.getElementById('modal-paket').style.display = 'flex';
  document.getElementById('modal-paket').classList.remove('hidden');
}

function closePaketModal() {
  document.getElementById('modal-paket').style.display = 'none';
}

function renderPilihanSoal() {
  const tbody = document.getElementById('pilihan-soal-tbody');
  const filterMapel = document.getElementById('paket-filter-mapel').value;
  
  tbody.innerHTML = '';
  
  if (!AppStore.soalList || AppStore.soalList.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:10px;">Bank soal kosong. Buat soal terlebih dahulu.</td></tr>';
    return;
  }
  
  const filteredSoal = filterMapel 
    ? AppStore.soalList.filter(s => s.mapel === filterMapel)
    : AppStore.soalList;
    
  filteredSoal.forEach(soal => {
    const isChecked = currentSelectedSoalIds.includes(soal.id);
    const safePertanyaan = FrontendSecurity.renderSafeHtml(soal.pertanyaan)
        .replace(/<[^>]*>/g, ' ')
        .substring(0, 100) + '...';
        
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="padding: 8px; border-bottom: 1px solid #E5E7EB;"><input type="checkbox" class="chk-pilih-soal" value="${soal.id}" ${isChecked ? 'checked' : ''} onchange="toggleSoalSelection('${soal.id}', this.checked)"></td>
      <td style="padding: 8px; border-bottom: 1px solid #E5E7EB;">${safePertanyaan}</td>
      <td style="padding: 8px; border-bottom: 1px solid #E5E7EB;">${soal.mapel || '-'}</td>
    `;
    tbody.appendChild(tr);
  });
  
  updateSelectedCount();
}

function toggleSoalSelection(id, isChecked) {
  if (isChecked) {
    if (!currentSelectedSoalIds.includes(id)) {
      currentSelectedSoalIds.push(id);
    }
  } else {
    currentSelectedSoalIds = currentSelectedSoalIds.filter(val => val !== id);
  }
  updateSelectedCount();
}

function updateSelectedCount() {
  document.getElementById('paket-count-terpilih').innerText = currentSelectedSoalIds.length;
}

function toggleAllPilihanSoal(master) {
  const checkboxes = document.querySelectorAll('.chk-pilih-soal');
  checkboxes.forEach(chk => {
    chk.checked = master.checked;
    toggleSoalSelection(chk.value, master.checked);
  });
}

function savePaket() {
  const btn = document.getElementById('btn-save-paket');
  btn.disabled = true;
  btn.innerText = 'Menyimpan...';
  
  const id = document.getElementById('paket-id').value;
  const nama = document.getElementById('paket-nama').value;
  const deskripsi = document.getElementById('paket-deskripsi').value;
  
  if (currentSelectedSoalIds.length === 0) {
    showToast('Pilih minimal satu soal untuk paket ini.', 'error');
    btn.disabled = false;
    btn.innerText = 'Simpan Paket';
    return;
  }
  
  const payload = {
    nama_paket: nama,
    deskripsi: deskripsi,
    soal_ids: currentSelectedSoalIds
  };
  
  let promise;
  if (id) {
    promise = api.call('executeAdminAction', AppStore.user.data.token, 'updatePaketSoal', { idPaket: id, data: payload });
  } else {
    promise = api.call('executeAdminAction', AppStore.user.data.token, 'createPaketSoal', { data: payload });
  }
  
  promise.then(res => {
    if (res.success) {
      showToast(res.message, 'success');
      closePaketModal();
      loadPaketSoal();
    } else {
      showToast(res.message, 'error');
    }
  }).finally(() => {
    btn.disabled = false;
    btn.innerText = 'Simpan Paket';
  });
}

function editPaket(id) {
  const paket = AppStore.paketList.find(p => p.id_paket === id);
  if (!paket) return;
  
  openPaketModal();
  document.getElementById('modal-paket-title').innerText = 'Edit Paket Soal';
  document.getElementById('paket-id').value = paket.id_paket;
  document.getElementById('paket-nama').value = paket.nama_paket;
  document.getElementById('paket-deskripsi').value = paket.deskripsi || '';
  
  currentSelectedSoalIds = Array.isArray(paket.soal_ids) ? [...paket.soal_ids] : [];
  renderPilihanSoal();
}

function deletePaket(id) {
  openConfirmModal(
    'Hapus Paket Soal',
    'Yakin ingin menghapus paket soal ini? Tindakan ini tidak akan menghapus soal-soal di bank soal.',
    '<i class="fas fa-trash"></i> Hapus Paket',
    () => {
      api.call('executeAdminAction', AppStore.user.data.token, 'deletePaketSoal', { idPaket: id }).then(res => {
        if (res.success) {
          showToast(res.message, 'success');
          loadPaketSoal();
        } else {
          showToast(res.message, 'error');
        }
      });
    }
  );
}
</script>

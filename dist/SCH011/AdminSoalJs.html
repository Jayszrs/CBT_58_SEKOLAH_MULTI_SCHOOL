function detectWebpSupport() {
  const testCanvas = document.createElement('canvas');
  testCanvas.width = 1;
  testCanvas.height = 1;
  return testCanvas.toDataURL('image/webp').indexOf('data:image/webp') === 0;
}

const BROWSER_SUPPORTS_WEBP = detectWebpSupport();

function compressImageToWebp(file, quality = 0.7, maxBase64Length = 1500000) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = function(event) {
      const img = new Image();
      img.src = event.target.result;
      img.onload = function() {
        const MAX_WIDTH = 1024;
        const MAX_HEIGHT = 1024;
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          }
        } else {
          if (height > MAX_HEIGHT) {
            width *= MAX_HEIGHT / height;
            height = MAX_HEIGHT;
          }
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);

        const outputFormat = BROWSER_SUPPORTS_WEBP ? 'image/webp' : 'image/jpeg';
        let currentQuality = quality;
        let dataUrl = canvas.toDataURL(outputFormat, currentQuality);

        while (dataUrl.length > maxBase64Length && currentQuality > 0.3) {
          currentQuality -= 0.1;
          dataUrl = canvas.toDataURL(outputFormat, currentQuality);
        }

        if (dataUrl.length > maxBase64Length) {
          const scaleFactor = 0.7;
          canvas.width = Math.round(width * scaleFactor);
          canvas.height = Math.round(height * scaleFactor);
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          dataUrl = canvas.toDataURL(outputFormat, 0.5);
        }

        resolve(dataUrl);
      };
      img.onerror = error => reject(error);
    };
    reader.onerror = error => reject(error);
  });
}

/** Quill 1.x does not have native editable table support; use an atomic block blot. */
function registerCbtTableBlot() {
  if (!window.Quill || window.__cbtTableRegistered) return;
  const BlockEmbed = Quill.import('blots/block/embed');
  class CbtTableBlot extends BlockEmbed {
    static create(value) {
      const node = super.create();
      const data = normalizeCbtTable(value);
      node.setAttribute('data-cbt-table', JSON.stringify(data));
      node.setAttribute('contenteditable', 'false');
      node.setAttribute('draggable', 'true');
      renderCbtTableNode(node, data);
      return node;
    }
    static value(node) {
      try { return normalizeCbtTable(JSON.parse(node.getAttribute('data-cbt-table') || '{}')); }
      catch (e) { return normalizeCbtTable({}); }
    }
  }
  CbtTableBlot.blotName = 'cbtTable';
  CbtTableBlot.tagName = 'DIV';
  CbtTableBlot.className = 'cbt-table-block';
  Quill.register(CbtTableBlot);
  window.__cbtTableRegistered = true;
}
function normalizeCbtTable(input) {
  const value = input && typeof input === 'object' ? input : {};
  const rows = Math.min(11, Math.max(1, Math.floor(Number(value.rows) || 3)));
  const cols = Math.min(5, Math.max(1, Math.floor(Number(value.cols) || 3)));
  const width = Math.min(100, Math.max(30, Math.floor(Number(value.width) || 100)));
  const align = ['left', 'center', 'right'].includes(value.align) ? value.align : 'center';
  const original = Array.isArray(value.cells) ? value.cells : [];
  const cells = Array.from({length:rows}, (_,r) => Array.from({length:cols},(_,c)=>String(original[r] && original[r][c] || '').slice(0,1500)));
  return { rows:rows, cols:cols, width:width, align:align, cells:cells };
}
function renderCbtTableNode(node, data) {
  node.textContent = '';
  node.style.width = data.width + '%';
  node.style.marginLeft = data.align === 'left' ? '0' : 'auto';
  node.style.marginRight = data.align === 'right' ? '0' : 'auto';
  const table = document.createElement('table');
  const tbody = document.createElement('tbody');
  data.cells.forEach(function(row) {
    const tr = document.createElement('tr');
    row.forEach(function(value) { const td=document.createElement('td');td.textContent=value;tr.appendChild(td); });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);node.appendChild(table);
  node.title = 'Seret ke posisi lain, atau klik dua kali untuk mengubah tabel';
}
function insertContextTable() { openContextTableDialog(null); }
function enableCbtTableEditing(editor) {
  editor.root.addEventListener('dblclick',function(e) {
    const block = e.target.closest('.cbt-table-block');
    if (block) { e.preventDefault();openContextTableDialog(block); }
  });
  let moving = null;
  editor.root.addEventListener('dragstart',function(e) {
    moving = e.target.closest('.cbt-table-block');
    if (!moving) return;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', 'CBT_TABLE_MOVE');
  });
  editor.root.addEventListener('dragover',function(e) { if (moving) e.preventDefault(); });
  editor.root.addEventListener('drop',function(e) {
    if (!moving) return;
    e.preventDefault();
    const target = e.target.closest('.cbt-table-block, p, li, h1, h2, div.ql-align-center, div.ql-align-right') || e.target;
    const targetBlot = Quill.find(target, true);
    const sourceBlot = Quill.find(moving);
    if (!sourceBlot || !targetBlot) {moving=null;return;}
    const sourceIndex = editor.getIndex(sourceBlot);
    const targetIndex = editor.getIndex(targetBlot);
    const tableData = normalizeCbtTable(JSON.parse(moving.getAttribute('data-cbt-table') || '{}'));
    if (sourceIndex === targetIndex) {moving=null;return;}
    editor.deleteText(sourceIndex, 1, 'user');
    editor.insertEmbed(targetIndex > sourceIndex ? targetIndex - 1 : targetIndex, 'cbtTable', tableData, 'user');
    moving = null;
  });
  editor.root.addEventListener('dragend',function() {moving=null;});
}
function openContextTableDialog(existingNode) {
  const prior = document.getElementById('cbt-table-config'); if (prior) prior.remove();
  let data;
  try {data=existingNode ? normalizeCbtTable(JSON.parse(existingNode.getAttribute('data-cbt-table'))) : normalizeCbtTable({});}
  catch(e) {data=normalizeCbtTable({});}
  const overlay=document.createElement('div');overlay.id='cbt-table-config';
  overlay.innerHTML = `<div class="cbt-table-dialog" role="dialog" aria-modal="true" aria-label="Pengaturan tabel bacaan">
    <h3 style="margin-bottom:12px">${existingNode ? 'Edit' : 'Sisipkan'} Tabel Bacaan</h3>
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
      <label>Kolom (1–5) <input id="cbt-t-cols" class="form-control" type="number" min="1" max="5" value="${data.cols}" style="width:85px"></label>
      <label>Baris (1–11) <input id="cbt-t-rows" class="form-control" type="number" min="1" max="11" value="${data.rows}" style="width:85px"></label>
      <label>Lebar (%) <input id="cbt-t-width" class="form-control" type="number" min="30" max="100" value="${data.width}" style="width:90px"></label>
      <label>Posisi <select id="cbt-t-align" class="form-control"><option value="left">Kiri</option><option value="center">Tengah</option><option value="right">Kanan</option></select></label>
      <button type="button" class="btn btn-outline" id="cbt-table-resize">Terapkan Ukuran</button>
    </div>
    <p style="font-size:12px;color:#4b5563;margin-top:10px">Isi sel tabel. Klik Simpan; seret tabel di dalam teks untuk memindahkan posisinya.</p>
    <div class="cbt-cell-grid" id="cbt-cell-grid"></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end">
      <button type="button" class="btn btn-outline" id="cbt-table-cancel">Batal</button>
      <button type="button" class="btn btn-primary" id="cbt-table-save">Simpan Tabel</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const rowInput=overlay.querySelector('#cbt-t-rows'), colInput=overlay.querySelector('#cbt-t-cols');
  const widthInput=overlay.querySelector('#cbt-t-width');
  overlay.querySelector('#cbt-t-align').value=data.align;
  const grid=overlay.querySelector('#cbt-cell-grid');
  function syncCells(){
    grid.querySelectorAll('textarea[data-row]').forEach(function(el) {
      const row=Number(el.dataset.row),col=Number(el.dataset.col);
      if(data.cells[row] && col < data.cells[row].length)data.cells[row][col]=el.value;
    });
  }
  function redrawGrid(){
    syncCells();const rows=Math.min(11,Math.max(1,Number(rowInput.value)||1));
    const cols=Math.min(5,Math.max(1,Number(colInput.value)||1));
    data=normalizeCbtTable({rows:rows,cols:cols,width:data.width,align:data.align,cells:data.cells});
    rowInput.value=data.rows;colInput.value=data.cols;
    grid.style.gridTemplateColumns='repeat('+cols+', minmax(85px,1fr))';
    grid.textContent='';
    data.cells.forEach(function(row,i){row.forEach(function(value,j){
      const field=document.createElement('textarea');field.dataset.row=i;field.dataset.col=j;
      field.setAttribute('aria-label','Baris '+(i+1)+' kolom '+(j+1));field.value=value;grid.appendChild(field);
    });});
  }
  overlay.querySelector('#cbt-table-resize').onclick = redrawGrid;
  overlay.querySelector('#cbt-table-cancel').onclick=function(){overlay.remove();};
  overlay.querySelector('#cbt-table-save').onclick=function(){
    syncCells();data.width=Math.min(100,Math.max(30,Number(widthInput.value)||100));
    data.align=overlay.querySelector('#cbt-t-align').value;
    const editor=quillContextEditor;
    if(existingNode){
      const blot=Quill.find(existingNode);
      const index=editor.getIndex(blot);
      editor.deleteText(index,1,'user');editor.insertEmbed(index,'cbtTable',data,'user');
    }else{
      const selection=editor.getSelection(true);
      const index=selection ? selection.index : editor.getLength()-1;
      editor.insertEmbed(index,'cbtTable',data,'user');
    }
    overlay.remove();
  };
  redrawGrid();
}

function initAdminSoal() {
  if (!AppStore.user || AppStore.user.role !== 'admin') {
    navigateTo('admin-login');
    return;
  }
  
  api.call('executeAdminAction', AppStore.user.data.token, 'ping', {}).then(res => {
      console.log('Backend Ping:', res);
  }).catch(e => console.error('Ping Failed', e));
  
  api.call('executeAdminAction', AppStore.user.data.token, 'getMapel', {}).then(res => {
      const mapelSelect = document.getElementById('soal-mapel');
      const paketFilterMapel = document.getElementById('paket-filter-mapel');
      if (res) {
          const optionsHtml = '<option value="">-- Tidak Ada --</option>' + 
              res.map(m => `<option value="${m.nama}">${m.nama}</option>`).join('');
          
          if (mapelSelect) mapelSelect.innerHTML = optionsHtml;
          if (paketFilterMapel) paketFilterMapel.innerHTML = '<option value="">Semua Mapel</option>' + 
              res.map(m => `<option value="${m.nama}">${m.nama}</option>`).join('');
          
          AppStore.mapelList = res;
      }
  }).catch(e => console.warn('Gagal memuat mapel', e));
  
  const richToolbar = [
    ['bold', 'italic', 'underline'],
    [{ script: 'sub' }, { script: 'super' }],
    [{ align: [] }],
    ['formula'],
    ['clean']
  ];

  registerCbtTableBlot();
  quillEditor = new Quill('#quill-editor', {
    theme: 'snow',
    modules: { toolbar: richToolbar, formula: true }
  });
  quillEditor.root.style.fontFamily = 'Arial, sans-serif';

  quillContextEditor = new Quill('#quill-context-editor', {
    theme: 'snow',
    modules: { toolbar: richToolbar, formula: true }
  });
  quillContextEditor.root.style.fontFamily = 'Arial, sans-serif';

  installWordMathPasteSupport(quillEditor);
  installWordMathPasteSupport(quillContextEditor);
  quillContextEditor.clipboard.addMatcher('.cbt-table-block', function(node) {
    try { return new (Quill.import('delta'))().insert({ cbtTable: normalizeCbtTable(JSON.parse(node.getAttribute('data-cbt-table') || '{}')) }); }
    catch (error) { return new (Quill.import('delta'))().insert(''); }
  });
  enableCbtTableEditing(quillContextEditor);

  const questionImageInput = document.getElementById('soal-gambar');
  if (questionImageInput) {
    questionImageInput.onchange = async function() {
      const previewContainer = document.getElementById('soal-gambar-preview');
      const previewImg = document.querySelector('#soal-gambar-preview img');
      const file = this.files && this.files[0];

      delete this.dataset.compressed;
      if (!file) return;

      if (!/^image\/(png|jpeg|webp)$/i.test(file.type)) {
        showToast('Format gambar harus PNG, JPG, atau WEBP.', 'error');
        this.value = '';
        this.dataset.processing = 'false';
        return;
      }
      if (file.size > 2 * 1024 * 1024) {
        showToast('Ukuran gambar maksimal 2 MB sebelum kompresi.', 'error');
        this.value = '';
        this.dataset.processing = 'false';
        return;
      }

      this.dataset.processing = 'true';
      previewContainer.classList.remove('hidden');
      previewImg.alt = 'Memproses gambar...';
      try {
        const compressedBase64 = await compressImageToWebp(file);
        this.dataset.compressed = compressedBase64;
        previewImg.src = compressedBase64;
        previewImg.alt = 'Pratinjau gambar pendukung';
      } catch (err) {
        console.error('Gagal kompres gambar:', err);
        showToast('Gagal memproses gambar.', 'error');
        this.value = '';
      } finally {
        this.dataset.processing = 'false';
      }
    };
  }

  const optionsContainer = document.getElementById('soal-options-container');
  if (optionsContainer) {
    optionsContainer.onchange = handleOptionImageChange;
  }

  loadBankSoal();
}


function handleOptionImageChange(event) {
  const input = event.target.closest('.option-image-input');
  if (!input) return;

  const file = input.files && input.files[0];
  const field = input.closest('.option-image-field');
  const preview = field ? field.querySelector('.option-image-preview') : null;
  delete input.dataset.compressed;
  if (!file) return;

  if (!/^image\/(png|jpeg|webp)$/i.test(file.type)) {
    showToast('Format gambar harus PNG, JPG, atau WEBP.', 'error');
    input.value = '';
    input.dataset.processing = 'false';
    return;
  }
  if (file.size > 2 * 1024 * 1024) {
    showToast('Ukuran setiap gambar pilihan maksimal 2 MB sebelum kompresi.', 'error');
    input.value = '';
    input.dataset.processing = 'false';
    return;
  }

  input.dataset.processing = 'true';
  if (preview) {
    preview.style.display = 'block';
    preview.removeAttribute('src');
    preview.alt = 'Memproses gambar...';
  }

  compressImageToWebp(file).then(function(dataUrl) {
    input.dataset.compressed = dataUrl;
    if (preview) {
      preview.src = dataUrl;
      preview.alt = 'Pratinjau gambar pilihan';
    }
  }).catch(function(error) {
    console.error('Gagal memproses gambar pilihan:', error);
    showToast('Gagal memproses gambar pilihan.', 'error');
    input.value = '';
  }).finally(function() {
    input.dataset.processing = 'false';
  });
}

function clearOptionImage(button) {
  const field = button.closest('.option-image-field');
  if (!field) return;
  const input = field.querySelector('.option-image-input');
  const preview = field.querySelector('.option-image-preview');
  if (input) {
    input.value = '';
    delete input.dataset.compressed;
    input.dataset.existingImage = '';
    input.dataset.processing = 'false';
  }
  if (preview) {
    preview.removeAttribute('src');
    preview.style.display = 'none';
  }
}


function setOptionImageRef(input, ref) {
  if (!input) return;
  input.dataset.existingImage = ref || '';
}

function getAdminImageBatch(refs) {
  return new Promise(function(resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      .getMultipleImageBase64(refs, getClientAuthorization());
  });
}

async function loadAdminOptionImagePreviews() {
  const inputs = Array.from(document.querySelectorAll('#soal-options-container .option-image-input'))
    .filter(input => input.dataset.existingImage);
  const refs = Array.from(new Set(inputs.map(input => input.dataset.existingImage)));
  if (!refs.length) return;

  const resultMap = {};
  try {
    for (let start = 0; start < refs.length; start += 4) {
      const batch = await getAdminImageBatch(refs.slice(start, start + 4));
      Object.assign(resultMap, batch || {});
    }
    inputs.forEach(function(input) {
      const ref = input.dataset.existingImage;
      const field = input.closest('.option-image-field');
      const preview = field && field.querySelector('.option-image-preview');
      if (preview && resultMap[ref]) {
        preview.src = resultMap[ref];
        preview.style.display = 'block';
        preview.alt = 'Gambar pilihan tersimpan';
      }
    });
  } catch (error) {
    console.warn('Gagal memuat pratinjau gambar pilihan:', error);
  }
}

function imageOnlyToken(type, index) {
  return `__CBT_IMAGE_${type}_${index + 1}__`;
}

function isImageOnlyToken(value) {
  return /^__CBT_IMAGE_(OPTION|MATCH_LEFT|MATCH_RIGHT)_\d+__$/.test(String(value || ''));
}

function visibleOptionText(value) {
  return isImageOnlyToken(value) ? '' : String(value == null ? '' : value);
}

function getOptionImageAt(soal, index, side) {
  const images = Array.isArray(soal && soal.opsi_gambar) ? soal.opsi_gambar : [];
  const item = images[index];
  if (item && typeof item === 'object') {
    return side === 'left' ? (item.kunci || '') : side === 'right' ? (item.nilai || '') : (item.url || '');
  }
  return typeof item === 'string' ? item : '';
}

function loadBankSoal() {
  api.call('executeAdminAction', AppStore.user.data.token, 'getAllSoal', { bypassCache: true }).then(res => {
    AppStore.soalList = res;
    renderTabelSoal();
  }).catch(err => {
    showToast('Gagal memuat bank soal', 'error');
  });
}

function renderTabelSoal() {
  if ($.fn.DataTable.isDataTable('#tbl-soal')) {
    $('#tbl-soal').DataTable().destroy();
  }

  const tbody = document.querySelector('#tbl-soal tbody');
  tbody.innerHTML = '';

  if (AppStore.soalList.length === 0) {
    tbody.innerHTML = getEmptyStateHtml(6, 'Belum ada soal tersimpan.', 'fa-file-alt');
    return;
  }

  const imageRefs = [];
  const imageTargetMap = {};

  AppStore.soalList.forEach((soal, idx) => {
    const safeHtmlPertanyaan = FrontendSecurity.renderSafeHtml(soal.pertanyaan);
    
    let cleanPertanyaan = safeHtmlPertanyaan
        .replace(/<img[^>]*>/gi, ' [Gambar] ')
        .replace(/<\/?(p|div|h[1-6]|ul|ol|li|blockquote|table|tr|td|th|tbody|thead|pre)[^>]*>/gi, ' ')
        .replace(/<br\s*\/?>/gi, ' ');

    let txt = `<div style="max-width: 350px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; white-space: normal;">${cleanPertanyaan.trim()}</div>`;

    let tipeFormat = `<span style="background-color: #F0FDFA; color: var(--primary); padding: 2px 6px; border-radius: 4px; font-size: 11px;">${soal.tipe}</span>`;

    let imgCellId = 'img-cell-' + idx;
    const hasOptionImage = Array.isArray(soal.opsi_gambar) && soal.opsi_gambar.some(function(item) {
      if (typeof item === 'string') return !!item;
      return !!(item && typeof item === 'object' && Object.keys(item).some(key => !!item[key]));
    });
    let imgV = soal.url_gambar
      ? `<span id="${imgCellId}"><i class="fas fa-spinner fa-spin" style="color:#10B981"></i></span>`
      : hasOptionImage
        ? `<span title="Gambar tersedia pada pilihan jawaban"><i class="fas fa-images" style="color:#10B981"></i> Opsi</span>`
        : `<span style="color:#9CA3AF">-</span>`;

    if (soal.url_gambar) {
      imageRefs.push(soal.url_gambar);
      imageTargetMap[soal.url_gambar] = imgCellId;
    }

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="text-align:center;"><input type="checkbox" class="chk-soal" value="${soal.id}" onchange="toggleBtnHapusTerpilih()"></td>
      <td>${idx + 1}</td>
      <td>${tipeFormat}</td>
      <td>${txt}</td>
      <td><span style="font-size: 0.85rem; color: #6B7280;">${soal.mapel || '-'}</span></td>
      <td>${soal.bobot}</td>
      <td style="text-align:center;">${imgV}</td>
      <td style="white-space:nowrap; text-align:center;">
        <div style="display:flex; justify-content:center; gap:0.25rem;">
          <button class="btn btn-outline" style="padding:0.25rem 0.5rem;" onclick="editSoal('${soal.id}')"><i class="fas fa-edit" style="color:var(--primary)"></i></button>
          <button class="btn btn-outline" style="padding:0.25rem 0.5rem;" onclick="deleteThisSoal('${soal.id}')"><i class="fas fa-trash" style="color:var(--danger)"></i></button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });

  $('#tbl-soal').DataTable({
    language: {
      search: 'Cari:',
      lengthMenu: 'Tampilkan _MENU_ data',
      info: 'Menampilkan _START_ sampai _END_ dari _TOTAL_ data',
      infoEmpty: 'Tidak ada data tersedia',
      paginate: { first: 'Pertama', last: 'Terakhir', next: '&rsaquo;', previous: '&lsaquo;' },
      zeroRecords: 'Tidak ditemukan data yang sesuai'
    },
    columnDefs: [
      { orderable: false, targets: [0, 1, 6, 7] }
    ],
    pageLength: 10
  });

  if (imageRefs.length > 0) {
    const thumbnailTimeoutId = setTimeout(function() {
      Object.keys(imageTargetMap).forEach(function(ref) {
        const el = document.getElementById(imageTargetMap[ref]);
        if (el && el.querySelector('.fa-spinner')) {
          el.innerHTML = '<i class="fas fa-image" style="color:#10B981" title="Ada Gambar"></i>';
        }
      });
    }, 15000);

    google.script.run
      .withSuccessHandler(function(resultMap) {
        clearTimeout(thumbnailTimeoutId);
        Object.keys(resultMap).forEach(function(ref) {
          const targetId = imageTargetMap[ref];
          const el = document.getElementById(targetId);
          if (el && resultMap[ref]) {
            el.innerHTML = '<img src="' + resultMap[ref] + '" style="max-height:40px; max-width:60px; border-radius:4px; border:1px solid #E5E7EB;">';
          } else if (el) {
            el.innerHTML = '<i class="fas fa-image" style="color:#10B981" title="Ada Gambar"></i>';
          }
        });
      })
      .withFailureHandler(function() {
        clearTimeout(thumbnailTimeoutId);
        Object.keys(imageTargetMap).forEach(function(ref) {
          const el = document.getElementById(imageTargetMap[ref]);
          if (el) {
            el.innerHTML = '<i class="fas fa-image" style="color:#10B981" title="Ada Gambar"></i>';
          }
        });
      })
      .getMultipleImageBase64(imageRefs, getClientAuthorization());
  }

  const chkAll = document.getElementById('chk-all-soal');
  if (chkAll) chkAll.checked = false;
  toggleBtnHapusTerpilih();

function buildChoiceEditor(name, label) {
  return `<div class="option-rich-toolbar" role="toolbar" aria-label="Pemformatan pilihan ${label}">
    <button type="button" onmousedown="event.preventDefault()" onclick="formatChoiceText(this, 'bold')" title="Bold"><b>B</b></button>
    <button type="button" onmousedown="event.preventDefault()" onclick="formatChoiceText(this, 'italic')" title="Italic"><i>I</i></button>
    <button type="button" onmousedown="event.preventDefault()" onclick="formatChoiceText(this, 'underline')" title="Underline"><u>U</u></button>
    <button type="button" onmousedown="event.preventDefault()" onclick="insertChoiceMath(this, 'fraction')" title="Pecahan bertingkat">a⁄b</button>
    <button type="button" onmousedown="event.preventDefault()" onclick="insertChoiceMath(this, 'script')" title="Pangkat atau indeks">xⁿ</button>
    <button type="button" onmousedown="event.preventDefault()" onclick="insertChoiceMath(this, 'radical')" title="Akar">√x</button>
  </div><div contenteditable="true" role="textbox" aria-multiline="true" name="${name}" class="option-rich-text" data-placeholder="Teks pilihan ${label}" aria-label="Teks pilihan ${label}"></div>`;
}
function formatChoiceText(button, command) {
  const editor = button.closest('.option-rich-toolbar').nextElementSibling;
  editor.focus(); document.execCommand(command, false, null);
}
function getChoiceEditorValue(editor) {
  if (!editor) return '';
  // Simpan formula sebagai LaTeX di data-value, bukan hasil renderer KaTeX.
  const clone = editor.cloneNode(true);
  const formulas = clone.querySelectorAll('.ql-formula[data-value]');
  const hasFormula = formulas.length > 0;
  formulas.forEach(function(node) { node.textContent = '∑'; });
  const isNotEmpty = String(clone.textContent || '').trim() || hasFormula;
  return isNotEmpty ? FrontendSecurity.renderSafeHtml(clone.innerHTML).trim() : '';
}
function insertChoiceMath(button, mode) {
  const editor = button.closest('.option-rich-toolbar').nextElementSibling;
  let latex = '';
  if (mode === 'fraction') {
    const a = prompt('Pembilang:', '1'); if (a === null) return;
    const b = prompt('Penyebut:', '2'); if (b === null) return;
    latex = '\\frac{' + a + '}{' + b + '}';
  } else if (mode === 'script') {
    const a = prompt('Variabel dasar:', 'x'); if (a === null) return;
    const b = prompt('Pangkat / indeks:', '2'); if (b === null) return;
    const index = confirm('Gunakan indeks bawah? Tekan OK untuk indeks, Cancel untuk pangkat.');
    latex = '{' + a + '}' + (index ? '_{' : '^{') + b + '}';
  } else {
    const a = prompt('Bilangan di dalam akar:', 'x'); if (a === null) return;
    const degree = prompt('Indeks akar (boleh kosong):', ''); if (degree === null) return;
    latex = '\\sqrt' + (degree.trim() ? '[' + degree + ']' : '') + '{' + a + '}';
  }
  const safeLatex = latex.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const spanHtml = `<span class="ql-formula" data-value="${safeLatex}" contenteditable="false">∑</span>&nbsp;`;
  editor.focus();document.execCommand('insertHTML', false, spanHtml);
  renderCbtMathTokens(editor);
}

function removeOptionDynamic(btn, tipe) {
  const container = document.getElementById(tipe + '-options');
  if (container.querySelectorAll('.' + tipe + '-row').length <= 2) return;

  btn.closest('.' + tipe + '-row').remove();
  const rows = container.querySelectorAll('.' + tipe + '-row');
  rows.forEach((row, idx) => {
    const label = String.fromCharCode(65 + idx);
    row.querySelector('.opt-label').innerText = label;
    row.querySelector('input[type=radio], input[type=checkbox]').value = idx;

function editSoal(id) {
  const soal = AppStore.soalList.find(item => item.id === id);
  if (!soal) return;
  if (soal.tipe === 'Esai') {
    showToast('Soal esai lama tetap tersimpan, tetapi pembuatan dan pengeditannya sudah ditutup.', 'error');
    return;
  }

  openSoalModal();
  modalAdminMode = 'edit';
  document.getElementById('modal-soal-title').innerText = 'Edit Soal';

  document.getElementById('soal-id').value = soal.id;
  document.getElementById('soal-tipe').value = soal.tipe;
  document.getElementById('soal-bobot').value = soal.bobot;
  document.getElementById('soal-gambar-url-old').value = soal.url_gambar || '';
  document.getElementById('soal-mapel').value = soal.mapel || '';
  document.getElementById('soal-petunjuk').value = soal.petunjuk || '';

  quillContextEditor.clipboard.dangerouslyPasteHTML(FrontendSecurity.renderSafeHtml(soal.teks_pendukung || ''), 'silent');
  quillEditor.root.innerHTML = FrontendSecurity.renderSafeHtml(soal.pertanyaan || '');

  if (soal.url_gambar) {
    const previewContainer = document.getElementById('soal-gambar-preview');
    const previewImg = document.querySelector('#soal-gambar-preview img');
    previewContainer.classList.remove('hidden');
    previewImg.alt = 'Memuat gambar pendukung...';

    google.script.run
      .withSuccessHandler(function(dataUri) {
        if (document.getElementById('soal-id').value !== soal.id) return;
        if (dataUri) {
          previewImg.src = dataUri;
          previewImg.alt = 'Gambar pendukung tersimpan';
        } else {
          previewImg.alt = 'Gambar tidak dapat dimuat';
        }
      })
      .withFailureHandler(function(error) {
        console.warn('Gagal memuat gambar pendukung:', error);
        previewImg.alt = 'Gambar tidak dapat dimuat';
      })
      .getImageBase64(soal.url_gambar, getClientAuthorization());
  }

  renderSoalOptionsUI();

  setTimeout(function() {
    const optionImages = Array.isArray(soal.opsi_gambar) ? soal.opsi_gambar : [];

    if (soal.tipe === 'PG') {
      const cont = document.getElementById('pg-options');
      if (cont && Array.isArray(soal.opsi) && soal.opsi.length) {
        cont.innerHTML = '';
        soal.opsi.forEach((value, index) => {
          const div = document.createElement('div');
          div.innerHTML = generatePOption(index);
          cont.appendChild(div.firstElementChild);
        });
      }

      const inputs = document.querySelectorAll('#pg-options .option-rich-text');
      const radios = document.getElementsByName('pg_kunci');
      soal.opsi.forEach((value, index) => {
        if (inputs[index]) { inputs[index].innerHTML = FrontendSecurity.renderSafeHtml(visibleOptionText(value)); renderCbtMathTokens(inputs[index]); }
        if (String(value) === String(soal.kunci_jawaban) && radios[index]) radios[index].checked = true;
        if (inputs[index]) {
          const imageInput = inputs[index].closest('.pg-row').querySelector('.option-image-input');
          setOptionImageRef(imageInput, getOptionImageAt(soal, index));
        }
      });
    }
    else if (soal.tipe === 'PG Kompleks') {
      const cont = document.getElementById('pgc-options');
      if (cont && Array.isArray(soal.opsi) && soal.opsi.length) {
        cont.innerHTML = '';
        soal.opsi.forEach((value, index) => {
          const div = document.createElement('div');
          div.innerHTML = generatePCOption(index);
          cont.appendChild(div.firstElementChild);
        });
      }

      const inputs = document.querySelectorAll('#pgc-options .option-rich-text');
      const checks = document.getElementsByName('pgc_kunci');
      soal.opsi.forEach((value, index) => {
        if (inputs[index]) { inputs[index].innerHTML = FrontendSecurity.renderSafeHtml(visibleOptionText(value)); renderCbtMathTokens(inputs[index]); }
        if ((soal.kunci_jawaban || []).map(String).includes(String(value)) && checks[index]) checks[index].checked = true;
        if (inputs[index]) {
          const imageInput = inputs[index].closest('.pgc-row').querySelector('.option-image-input');
          setOptionImageRef(imageInput, getOptionImageAt(soal, index));
        }
      });
    }
    else if (soal.tipe === 'Isian Singkat') {
      const field = document.getElementsByName('isian_kunci')[0];
      if (field) field.value = soal.kunci_jawaban || '';
    }
    else if (soal.tipe === 'Benar Salah' || soal.tipe === 'Sesuai Tidak Sesuai') {
      const statements = Array.isArray(soal.opsi) ? soal.opsi : [];
      const keys = Array.isArray(soal.kunci_jawaban) ? soal.kunci_jawaban : [];
      const statementInputs = document.getElementsByName('bs_statement');
      const keySelects = document.getElementsByName('bs_key');
      for (let index = 0; index < 3; index++) {
        if (statementInputs[index]) {
          statementInputs[index].value = visibleOptionText(statements[index] || '');
          const row = statementInputs[index].closest('.bs-admin-row');
          const imageInput = row && row.querySelector('.option-image-input');
          setOptionImageRef(imageInput, getOptionImageAt(soal, index));
        }
        if (keySelects[index]) keySelects[index].value = keys[index] || (index < 2 ? 'Benar' : 'Salah');
      }
    }
    else if (soal.tipe === 'Menjodohkan') {
      const cont = document.getElementById('jodoh-options');
      cont.innerHTML = '';

      (soal.opsi || []).forEach((pair, index) => {
        const parts = String(pair).split(':::');
        const leftValue = parts[0] || '';
        const rightValue = parts.slice(1).join(':::') || '';

        const div = document.createElement('div');
        div.innerHTML = generateJodohOption(index);
        const row = div.firstElementChild;

        row.querySelector('[name=jodoh_kunci]').value = visibleOptionText(leftValue);
        row.querySelector('[name=jodoh_nilai]').value = visibleOptionText(soal.kunci_jawaban && soal.kunci_jawaban[leftValue] !== undefined ? soal.kunci_jawaban[leftValue] : rightValue);

        const imageObject = optionImages[index] && typeof optionImages[index] === 'object' ? optionImages[index] : {};
        const imageInputs = row.querySelectorAll('.option-image-input');
        setOptionImageRef(imageInputs[0], imageObject.kunci || '');
        setOptionImageRef(imageInputs[1], imageObject.nilai || '');
        cont.appendChild(row);
      });
    }

    loadAdminOptionImagePreviews();
  }, 80);
}

async function uploadImageInput(input, fallbackRef, filenamePrefix) {
  if (!input) return fallbackRef || '';
  if (input.dataset.processing === 'true') {
    throw new Error('Mohon tunggu sampai proses kompresi gambar selesai.');
  }

  const file = input.files && input.files[0];
  if (!file) return input.dataset.existingImage || fallbackRef || '';

  const compressedBase64 = input.dataset.compressed;
  if (!compressedBase64) {
    throw new Error('Gambar belum selesai diproses. Silakan pilih ulang gambar.');
  }

  const originalName = String(file.name || 'gambar').replace(/[^a-zA-Z0-9._-]/g, '_');
  const extension = compressedBase64.indexOf('data:image/webp') === 0 ? '.webp' : '.jpg';
  const cleanPrefix = String(filenamePrefix || 'soal').replace(/[^a-zA-Z0-9_-]/g, '_');
  const filename = cleanPrefix + '_' + Date.now() + '_' + originalName.replace(/\.[^.]+$/, '') + extension;

  const response = await api.call('executeAdminAction', AppStore.user.data.token, 'uploadImage', { base64Data: compressedBase64, filename: filename });
  if (!response || !response.success || !response.url) {
    throw new Error(response && response.message ? response.message : 'Gagal mengunggah gambar ke Google Drive.');
  }
  return response.url;
}

// ----- Editor matematika: pecahan, pangkat, akar, dan paste persamaan Word -----
function getQuestionEditor(target) {
  return target === 'context' ? quillContextEditor : quillEditor;
}

function hasRichEditorContent(editor) {
  if (!editor || !editor.root) return false;
  if (String(editor.getText() || '').replace(/\u200B/g, '').trim()) return true;
  return !!editor.root.querySelector('.ql-formula, img, .cbt-table-block');
}

function insertMathLatex(target, latex) {
  const editor = getQuestionEditor(target);
  if (!editor || !window.katex) {
    showToast('Komponen matematika belum termuat. Muat ulang halaman lalu coba lagi.', 'error');
    return;
  }
  const range = editor.getSelection(true) || { index: Math.max(0, editor.getLength() - 1), length: 0 };
  editor.insertEmbed(range.index, 'formula', String(latex || ''), 'user');
  editor.setSelection(range.index + 1, 0, 'silent');
  editor.focus();
}

function formatEditorParagraph(target, alignment) {
  const editor = getQuestionEditor(target);
  if (!editor) return;
  const range = editor.getSelection(true) || { index: Math.max(0, editor.getLength() - 1), length: 0 };
  editor.formatLine(range.index, Math.max(1, range.length), 'align', alignment === 'left' ? false : alignment, 'user');
  editor.focus();
}

}

function mathNodeName(node) {
  return String(node && (node.localName || node.nodeName) || '').split(':').pop().toLowerCase();
}

function mathChildren(node) {
  return Array.from(node && node.children ? node.children : []);
}

function mathText(node) {
  return String(node && node.textContent || '').replace(/\s+/g, ' ').trim();
}

function mathMlNodeToLatex(node) {
  const name = mathNodeName(node);
  const children = mathChildren(node);
  const child = i => mathMlNodeToLatex(children[i]);
  if (name === 'math' || name === 'mrow' || name === 'semantics' || name === 'mstyle' || name === 'mpadded' || name === 'mphantom') return children.map(mathMlNodeToLatex).join('');
  if (name === 'mi' || name === 'mn' || name === 'mtext') return mathText(node);
  if (name === 'mo') {
    const op = mathText(node);
    const map = { '×': '\\times ', '÷': '\\div ', '−': '-', '≤': '\\le ', '≥': '\\ge ', '≠': '\\ne ', 'π': '\\pi ', '∞': '\\infty ', '·': '\\cdot ' };
    return map[op] || op;
  }
  if (name === 'mfrac') return '\\frac{' + child(0) + '}{' + child(1) + '}';
  if (name === 'msqrt') return '\\sqrt{' + children.map(mathMlNodeToLatex).join('') + '}';
  if (name === 'mroot') return '\\sqrt[' + child(1) + ']{' + child(0) + '}';
  if (name === 'msup') return '{' + child(0) + '}^{' + child(1) + '}';
  if (name === 'msub') return '{' + child(0) + '}_{' + child(1) + '}';
  if (name === 'msubsup') return '{' + child(0) + '}_{' + child(1) + '}^{' + child(2) + '}';
  if (name === 'mfenced') {
    const open = node.getAttribute('open') || '(';
    const close = node.getAttribute('close') || ')';
    return '\\left' + open + children.map(mathMlNodeToLatex).join(',') + '\\right' + close;
  }
  if (name === 'mtable') return '\\begin{matrix}' + children.map(mathMlNodeToLatex).join('\\\\') + '\\end{matrix}';
  if (name === 'mtr') return children.map(mathMlNodeToLatex).join(' & ');
  if (name === 'mtd') return children.map(mathMlNodeToLatex).join('');
  return children.length ? children.map(mathMlNodeToLatex).join('') : mathText(node);
}

function ommlNodeToLatex(node) {
  const name = mathNodeName(node);
  const children = mathChildren(node);
  const find = wanted => children.find(c => mathNodeName(c) === wanted);
  const inner = n => n ? mathChildren(n).map(ommlNodeToLatex).join('') : '';
  if (name === 't') return mathText(node);
  if (name === 'r') return children.filter(c => mathNodeName(c) === 't').map(ommlNodeToLatex).join('');
  if (name === 'oMath' || name === 'oMathPara' || name === 'e' || name === 'num' || name === 'den' || name === 'sub' || name === 'sup' || name === 'deg' || name === 'fName') return children.map(ommlNodeToLatex).join('');
  if (name === 'f') return '\\frac{' + inner(find('num')) + '}{' + inner(find('den')) + '}';
  if (name === 'rad') {
    const e = inner(find('e'));
    const deg = inner(find('deg'));
    return deg ? '\\sqrt[' + deg + ']{' + e + '}' : '\\sqrt{' + e + '}';
  }
  if (name === 'sSup') return '{' + inner(find('e')) + '}^{' + inner(find('sup')) + '}';
  if (name === 'sSub') return '{' + inner(find('e')) + '}_{' + inner(find('sub')) + '}';
  if (name === 'sSubSup') return '{' + inner(find('e')) + '}_{' + inner(find('sub')) + '}^{' + inner(find('sup')) + '}';
  if (name === 'd') {
    const begin = find('begChr'), end = find('endChr'), e = find('e');
    return '\\left' + (begin ? begin.getAttribute('val') || '(' : '(') + inner(e) + '\\right' + (end ? end.getAttribute('val') || ')' : ')');
  }
  if (name === 'nary') {
    const chr = find('naryPr');
    const symbol = chr && chr.querySelector ? chr.querySelector('[val]') : null;
    return (symbol ? symbol.getAttribute('val') : '\\sum') + inner(find('sub')) + inner(find('sup')) + inner(find('e'));
  }
  return children.map(ommlNodeToLatex).join('');
}

function installWordMathPasteSupport(editor) {
  if (!editor || !editor.clipboard || !window.katex) return;
  const Delta = Quill.import('delta');
  editor.root.addEventListener('paste', function (event) {
    const clipboard = event.clipboardData;
    const html = clipboard && clipboard.getData ? clipboard.getData('text/html') : '';
    if (!html || !/(<math\b|oMath|m:oMath)/i.test(html)) return;

    const parsed = new DOMParser().parseFromString(html, 'text/html');
    const allElements = Array.from(parsed.body.querySelectorAll('*'));
    const candidates = allElements.filter(function (node) {
      const name = mathNodeName(node);
      return name === 'math' || name === 'omathpara' || name === 'omath';
    });
    const topLevelMathNodes = candidates.filter(function (node) {
      let parent = node.parentElement;
      while (parent && parent !== parsed.body) {
        const parentName = mathNodeName(parent);
        if (parentName === 'math' || parentName === 'omathpara' || parentName === 'omath') return false;
        parent = parent.parentElement;
      }
      return true;
    });
    if (!topLevelMathNodes.length) return;

    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();
    const formulas = {};
    topLevelMathNodes.forEach(function (node, index) {
      const name = mathNodeName(node);
      const latex = name === 'math' ? mathMlNodeToLatex(node) : ommlNodeToLatex(node);
      if (!latex) return;
      const token = 'CBT_MATH_TOKEN_' + index + '_END';
      formulas[token] = latex;
      node.replaceWith(parsed.createTextNode(token));
    });

    const pasted = editor.clipboard.convert(parsed.body.innerHTML);
    const rebuilt = new Delta();
    (pasted.ops || []).forEach(function (op) {
      if (typeof op.insert !== 'string') {
        rebuilt.insert(op.insert, op.attributes);
        return;
      }
      const tokenPattern = /(CBT_MATH_TOKEN_\d+_END)/g;
      const parts = op.insert.split(tokenPattern);
      parts.forEach(function (part) {
        if (!part) return;
        if (Object.prototype.hasOwnProperty.call(formulas, part)) rebuilt.insert({ formula: formulas[part] });
        else rebuilt.insert(part, op.attributes);
      });
    });

    const range = editor.getSelection(true) || { index: Math.max(0, editor.getLength() - 1), length: 0 };
    const change = new Delta().retain(range.index).delete(range.length).concat(rebuilt);
    editor.updateContents(change, 'user');
    editor.setSelection(range.index + rebuilt.length(), 0, 'silent');
  }, true);

  // Matcher cadangan untuk aplikasi Office yang menyalin MathML sebagai node langsung.
  editor.clipboard.addMatcher(Node.ELEMENT_NODE, function (node, delta) {
    const name = mathNodeName(node);
    if (name === 'math') {
      const latex = mathMlNodeToLatex(node);
      return latex ? new Delta().insert({ formula: latex }) : delta;
    }
    if (name === 'omath' || name === 'omathpara') {
      const latex = ommlNodeToLatex(node);
      return latex ? new Delta().insert({ formula: latex }) : delta;
    }
    return delta;
  });
}

async function saveSoal() {
  const btn = document.getElementById('btn-save-soal');
  if (btn.disabled) return;

  btn.disabled = true;
  btn.innerText = 'Memeriksa soal...';

  try {
    const idValue = document.getElementById('soal-id').value;
    const tipe = document.getElementById('soal-tipe').value;
    const pertanyaan = quillEditor.root.innerHTML;
    const teksPendukung = hasRichEditorContent(quillContextEditor) ? quillContextEditor.root.innerHTML : '';
    const petunjuk = document.getElementById('soal-petunjuk').value.trim();
    const bobot = Number(document.getElementById('soal-bobot').value);
    const mapel = document.getElementById('soal-mapel').value;

    if (!hasRichEditorContent(quillEditor)) {
      throw new Error('Kolom pertanyaan wajib diisi.');
    }
    if (!Number.isFinite(bobot) || bobot < 1) {
      throw new Error('Bobot soal minimal 1.');
    }

    const allImageInputs = Array.from(document.querySelectorAll('#soal-gambar, #soal-options-container .option-image-input'));
    if (allImageInputs.some(input => input.dataset.processing === 'true')) {
      throw new Error('Tunggu sampai semua gambar selesai diproses.');
    }

    let opsiArray = [];
    let kunciJawaban = null;
    let opsiGambar = [];
    const uploadTasks = [];

    const addImageUploadTask = (input, fallback, prefix, setter) => {
      uploadTasks.push(async function() {
        const url = await uploadImageInput(input, fallback, prefix);
        setter(url || '');
      });
    };

    if (tipe === 'PG' || tipe === 'PG Kompleks') {
      const isComplex = tipe === 'PG Kompleks';
      const rowSelector = isComplex ? '.pgc-row' : '.pg-row';
      const rows = Array.from(document.querySelectorAll('#' + (isComplex ? 'pgc-options' : 'pg-options') + ' ' + rowSelector));
      if (rows.length < 2) throw new Error('Minimal harus ada dua pilihan jawaban.');

      kunciJawaban = isComplex ? [] : null;
      rows.forEach((row, index) => {
        const textInput = row.querySelector('.option-rich-text');
        const imageInput = row.querySelector('.option-image-input');
        const text = textInput ? getChoiceEditorValue(textInput) : '';
        const existingImage = imageInput ? (imageInput.dataset.existingImage || '') : '';
        const hasNewImage = !!(imageInput && imageInput.files && imageInput.files[0]);
        if (!text && !existingImage && !hasNewImage) {
          throw new Error('Pilihan ' + String.fromCharCode(65 + index) + ' harus diisi teks atau gambar.');
        }

        const optionValue = text || imageOnlyToken('OPTION', index);
        opsiArray.push(optionValue);
        opsiGambar.push('');
        addImageUploadTask(imageInput, existingImage, 'opsi_' + (index + 1), url => { opsiGambar[index] = url; });

        if (isComplex) {
          const check = row.querySelector('input[name="pgc_kunci"]');
          if (check && check.checked) kunciJawaban.push(optionValue);
        } else {
          const radio = row.querySelector('input[name="pg_kunci"]');
          if (radio && radio.checked) kunciJawaban = optionValue;
        }
      });

      if (isComplex && kunciJawaban.length === 0) {
        throw new Error('Pilih minimal satu jawaban benar untuk Pilihan Ganda Kompleks.');
      }
      if (!isComplex && !kunciJawaban) {
        throw new Error('Tentukan satu kunci jawaban yang benar.');
      }
    }
    else if (tipe === 'Isian Singkat') {
      const field = document.getElementsByName('isian_kunci')[0];
      kunciJawaban = field ? field.value.trim() : '';
      if (!kunciJawaban) throw new Error('Kunci jawaban isian singkat wajib diisi.');
    }
    else if (tipe === 'Menjodohkan') {
      const rows = Array.from(document.querySelectorAll('#jodoh-options .jodoh-row'));
      if (rows.length < 2) throw new Error('Soal menjodohkan minimal memiliki dua pasangan.');

      kunciJawaban = {};
      rows.forEach((row, index) => {
        const leftInput = row.querySelector('[name="jodoh_kunci"]');
        const rightInput = row.querySelector('[name="jodoh_nilai"]');
        const imageInputs = row.querySelectorAll('.option-image-input');
        const leftText = leftInput ? leftInput.value.trim() : '';
        const rightText = rightInput ? rightInput.value.trim() : '';
        const leftExisting = imageInputs[0] ? imageInputs[0].dataset.existingImage || '' : '';
        const rightExisting = imageInputs[1] ? imageInputs[1].dataset.existingImage || '' : '';
        const leftNew = !!(imageInputs[0] && imageInputs[0].files && imageInputs[0].files[0]);
        const rightNew = !!(imageInputs[1] && imageInputs[1].files && imageInputs[1].files[0]);

        if ((!leftText && !leftExisting && !leftNew) || (!rightText && !rightExisting && !rightNew)) {
          throw new Error('Setiap pasangan harus memiliki isi pada kolom kiri dan kanan, berupa teks atau gambar.');
        }

        const leftValue = leftText || imageOnlyToken('MATCH_LEFT', index);
        const rightValue = rightText || imageOnlyToken('MATCH_RIGHT', index);
        opsiArray.push(leftValue + ':::' + rightValue);
        kunciJawaban[leftValue] = rightValue;

        const imageObject = { kunci: '', nilai: '' };
        opsiGambar.push(imageObject);
        addImageUploadTask(imageInputs[0], leftExisting, 'jodoh_kiri_' + (index + 1), url => { opsiGambar[index].kunci = url; });
        addImageUploadTask(imageInputs[1], rightExisting, 'jodoh_kanan_' + (index + 1), url => { opsiGambar[index].nilai = url; });
      });
    }
    else if (tipe === 'Benar Salah' || tipe === 'Sesuai Tidak Sesuai') {
      const isSesuai = tipe === 'Sesuai Tidak Sesuai';
      const rows = Array.from(document.querySelectorAll('#soal-options-container .bs-admin-row'));
      const keys = [];
      if (rows.length !== 3) throw new Error('Soal kategori harus memiliki tepat tiga pernyataan.');

      rows.forEach((row, index) => {
        const statementInput = row.querySelector('[name="bs_statement"]');
        const imageInput = row.querySelector('.option-image-input');
        const text = statementInput ? statementInput.value.trim() : '';
        const existingImage = imageInput ? imageInput.dataset.existingImage || '' : '';
        const hasNewImage = !!(imageInput && imageInput.files && imageInput.files[0]);
        if (!text && !existingImage && !hasNewImage) {
          throw new Error('Pernyataan nomor ' + (index + 1) + ' harus diisi teks atau gambar.');
        }

        opsiArray.push(text || imageOnlyToken('OPTION', index));
        opsiGambar.push('');
        addImageUploadTask(imageInput, existingImage, 'pernyataan_' + (index + 1), url => { opsiGambar[index] = url; });

        const keySelect = row.querySelector('[name="bs_key"]');
        keys.push(keySelect ? keySelect.value : '');
      });

      const benarCount = keys.filter(value => value === 'Benar').length;
      const salahCount = keys.filter(value => value === 'Salah').length;
      if (!isSesuai && (benarCount !== 2 || salahCount !== 1)) {
        throw new Error('Kunci Benar/Salah wajib terdiri dari tepat 2 jawaban Benar dan 1 jawaban Salah.');
      }
      kunciJawaban = keys;
    }
    else if (tipe === 'Esai') {
      throw new Error('Pembuatan soal esai telah dinonaktifkan.');
    }

    const questionImageInput = document.getElementById('soal-gambar');
    const oldQuestionImage = document.getElementById('soal-gambar-url-old').value || '';
    let questionImageUrl = oldQuestionImage;

    const payload = {
      tipe: tipe,
      pertanyaan: pertanyaan,
      petunjuk: petunjuk,
      teks_pendukung: teksPendukung,
      opsi: opsiArray,
      opsi_gambar: opsiGambar,
      kunci_jawaban: kunciJawaban,
      bobot: bobot,
      url_gambar: oldQuestionImage,
      mapel: mapel
    };

    btn.innerText = 'Mengunggah gambar...';
    questionImageUrl = await uploadImageInput(questionImageInput, oldQuestionImage, 'gambar_pendukung');
    payload.url_gambar = questionImageUrl;

    for (let index = 0; index < uploadTasks.length; index++) {
      await uploadTasks[index]();
    }

    btn.innerText = 'Menyimpan soal...';
    submitSoalToBackend(idValue, payload, btn);
  } catch (error) {
    console.error('Gagal menyimpan soal:', error);
    showToast(error && error.message ? error.message : 'Terjadi kesalahan saat menyimpan soal.', 'error');
    btn.disabled = false;
    btn.innerText = 'Simpan Soal';
  }
}

function submitSoalToBackend(id, payload, btn) {
  let callPromise;
  if(id) {
    callPromise = api.call('executeAdminAction', AppStore.user.data.token, 'updateSoal', { id: id, data: payload });
  } else {
    mapelSaatIni = payload.mapel; 
    callPromise = api.call('executeAdminAction', AppStore.user.data.token, 'createSoal', { data: payload });
  }
  
  callPromise.then(res => {
    if (res.success) {
      showToast(res.message, 'success');
      closeSoalModal();
      loadBankSoal();
    } else {
      showToast(res.message || 'Soal gagal disimpan.', 'error');
    }
  }).catch(error => {
    console.error('Backend gagal menyimpan soal:', error);
    showToast('Terjadi gangguan saat menyimpan soal ke database.', 'error');
  }).finally(() => {
    btn.disabled = false;
    btn.innerText = 'Simpan Soal';
  });
}

<script>
class LogoManagementSystem {
  constructor() {
    this.selectedFile = null;
    this.maxBase64Length = 8500;
  }

  openModal() {
    const modal = document.getElementById('logo-modal');
    if (modal) {
      modal.style.display = 'flex';
      void modal.offsetWidth;
      modal.classList.add('show');
      this.resetState();
    }
  }

  closeModal() {
    const modal = document.getElementById('logo-modal');
    if (modal) {
      modal.classList.remove('show');
      setTimeout(() => {
        modal.style.display = 'none';
        this.resetState();
      }, 300);
    }
  }

  resetState() {
    this.selectedFile = null;
    const input = document.getElementById('logo-upload-input-modal');
    if (input) input.value = '';
    
    const previewContainer = document.getElementById('logo-preview-container');
    const previewImg = document.getElementById('logo-preview-img');
    const saveBtn = document.getElementById('btn-save-logo');
    
    if (previewContainer) previewContainer.style.display = 'none';
    if (previewImg) previewImg.src = '';
    if (saveBtn) {
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<i class="fas fa-save"></i> Simpan';
    }
  }

  previewImage(inputElement) {
    if (!inputElement.files || inputElement.files.length === 0) return;
    const file = inputElement.files[0];

    if (!file.type.match('image.*')) {
      showToast('Hanya file gambar yang diizinkan.', 'error');
      this.resetState();
      return;
    }

    this.selectedFile = file;
    const reader = new FileReader();
    
    reader.onload = (event) => {
      const previewContainer = document.getElementById('logo-preview-container');
      const previewImg = document.getElementById('logo-preview-img');
      const saveBtn = document.getElementById('btn-save-logo');

      if (previewContainer && previewImg && saveBtn) {
        previewImg.src = event.target.result;
        previewContainer.style.display = 'flex';
        saveBtn.disabled = false;
      }
    };
    
    reader.onerror = () => {
      showToast('Tidak dapat membaca gambar.', 'error');
      this.resetState();
    };
    
    reader.readAsDataURL(file);
  }

  compressAndConvertImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      
      reader.onload = (event) => {
        const img = new Image();
        
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 200;
          const MAX_HEIGHT = 80;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }
          
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          
          ctx.fillStyle = "rgba(255, 255, 255, 0)"; 
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);

          let quality = 0.8;
          let base64Data = canvas.toDataURL("image/webp", quality);

          while (base64Data.length > this.maxBase64Length && quality > 0.1) {
              quality -= 0.1;
              base64Data = canvas.toDataURL("image/webp", quality);
          }

          if (base64Data.length > this.maxBase64Length) {
            reject('Ukuran gambar terlalu besar meskipun sudah dikompresi. Gunakan gambar yang lebih sederhana.');
            return;
          }
          
          resolve(base64Data);
        };
        
        img.onerror = () => reject('Gagal memproses gambar untuk kompresi.');
        img.src = event.target.result;
      };
      
      reader.onerror = () => reject('Gagal membaca file sistem.');
      reader.readAsDataURL(file);
    });
  }

  updateUserInterfaceLogos(base64Data) {
    if (typeof APP_GLOBAL_CONFIG !== 'undefined') {
      APP_GLOBAL_CONFIG.logo_url = base64Data;
      APP_GLOBAL_CONFIG.applicationLogoData = base64Data;
    }

    const logoElementIds = [
      'sidebar-logo-img',
      'admin-login-logo',
      'student-login-logo'
    ];

    logoElementIds.forEach(id => {
      const imgElement = document.getElementById(id);
      if (imgElement) {
        imgElement.src = base64Data;
        imgElement.style.display = 'inline-block';
        
        const container = document.getElementById(id + '-container');
        if(container) container.style.display = 'block';
      }
    });
    
    const sidebarImgEl = document.getElementById('sidebar-logo-img');
    if (!sidebarImgEl) {
      const headerDiv = document.querySelector('.sidebar-header > div');
      if (headerDiv) {
        const newImg = document.createElement('img');
        newImg.id = 'sidebar-logo-img';
        newImg.src = base64Data;
        newImg.alt = 'Logo';
        newImg.style.cssText = 'max-height: 24px; vertical-align: middle; margin-right: 8px; flex-shrink: 0;';
        headerDiv.insertBefore(newImg, headerDiv.firstChild);
      }
    }
  }

  saveToServer() {
    if (!this.selectedFile) {
      showToast('Silakan pilih gambar logo terlebih dahulu.', 'warning');
      return;
    }

    const saveBtn = document.getElementById('btn-save-logo');
    if (saveBtn) {
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
    }

    this.compressAndConvertImage(this.selectedFile)
      .then(base64DataString => {
        console.log(`[ADMIN LOG] ${new Date().toISOString()} - Upload Logo: Memulai proses penyimpanan logo ke PropertiesService`);
        
        api.call('executeAdminAction', AppStore.user.data.token, 'uploadLogoApp', { fileData: base64DataString })
          .then((responseObject) => {
            if (responseObject && responseObject.success) {
              showToast(responseObject.message || 'Logo berhasil diperbarui.', 'success');
              this.updateUserInterfaceLogos(responseObject.url || base64DataString);
              this.closeModal();
            } else {
              showToast('Gagal mengubah logo: ' + (responseObject && responseObject.message ? responseObject.message : 'Respons server tidak valid.'), 'error');
              this.restoreSaveButton();
            }
          })
          .catch((error) => {
            showToast('Koneksi terputus: ' + (error && error.message ? error.message : 'silakan coba kembali.'), 'error');
            this.restoreSaveButton();
          });
      })
      .catch(errorMessage => {
        showToast(errorMessage, 'error');
        this.restoreSaveButton();
      });
  }

  restoreSaveButton() {
    const saveBtn = document.getElementById('btn-save-logo');
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.innerHTML = '<i class="fas fa-save"></i> Simpan';
    }
  }
}

const appLogoSystem = new LogoManagementSystem();

function openLogoModal() {
  appLogoSystem.openModal();
}

function closeLogoModal() {
  appLogoSystem.closeModal();
}

function previewSelectedLogo(inputElement) {
  appLogoSystem.previewImage(inputElement);
}

function processAndUploadLogo() {
  appLogoSystem.saveToServer();
}

document.addEventListener('DOMContentLoaded', () => {
  if (typeof APP_GLOBAL_CONFIG !== 'undefined' && APP_GLOBAL_CONFIG.logo_url) {
    appLogoSystem.updateUserInterfaceLogos(APP_GLOBAL_CONFIG.logo_url);
  }
});
</script>

  <div id="global-confirm-modal" class="modal-overlay hidden" style="z-index: 9999;">
    <div class="modal" style="max-width: 400px;">
      <div class="modal-header">
        <h3 id="confirm-modal-title" style="color:var(--danger)">Konfirmasi</h3>
        <button class="modal-close" onclick="closeConfirmModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p id="confirm-modal-msg" style="margin-bottom: 0;">Apakah Anda yakin?</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeConfirmModal()">Batal</button>

      </div>
    </div>

  <div id="admin-password-modal" class="modal-overlay hidden">

        <button class="modal-close" onclick="closeAdminPasswordModal()">&times;</button>
      </div>

        <div class="form-group mb-4">
          <label>Password Lama</label>
          <div class="password-wrapper">
            <input type="password" id="global-old-admin-password" class="form-control" placeholder="Masukkan password lama">
            <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility(this)"></i>
          </div>
        </div>
        <div class="form-group mb-4">
          <label>Password Baru</label>
          <div class="password-wrapper">
            <input type="password" id="global-new-admin-password" class="form-control" placeholder="Minimal 14 karakter" minlength="14">
            <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility(this)"></i>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeAdminPasswordModal()">Batal</button>
        <button class="btn btn-primary" onclick="submitGlobalAdminPassword(this)"><i class="fas fa-save"></i> Simpan Password</button>
      </div>
    </div>
  </div>
